<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Круги — обратный отсчёт</title>
<style>
:root{--bg:#11151a;--empty:#3a4149;--green1:#58e68a;--green2:#19a95a;--text:#f5f7f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#26313a,#11151a 55%);color:var(--text);font-family:Arial,sans-serif}
header{padding:22px;text-align:center}h1{margin:0 0 8px;font-size:28px}p{margin:0;color:#aeb7bf}
#grid{width:min(1200px,94vw);margin:18px auto 100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:24px}
.timer{display:flex;flex-direction:column;align-items:center;gap:9px}
.circle{position:relative;width:120px;height:120px;border-radius:50%;background:var(--empty);box-shadow:inset 0 5px 12px #0008,0 8px 18px #0007;overflow:hidden}
.fill{position:absolute;inset:0;background:linear-gradient(145deg,var(--green1),var(--green2));transform-origin:center bottom;transition:clip-path .25s linear;clip-path:inset(0 0 0 0)}
.gloss{position:absolute;inset:5px;border-radius:50%;background:linear-gradient(135deg,#fff5,transparent 35%);pointer-events:none}
.value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:25px;text-shadow:0 2px 4px #0009}
input{width:90px;padding:7px 6px;border:1px solid #5a646d;border-radius:8px;background:#20272e;color:white;text-align:center}
button{border:0;border-radius:8px;padding:7px 12px;background:#273039;color:white;cursor:pointer}
button.start{background:#20a85c}button:hover{filter:brightness(1.15)}
.controls{position:fixed;bottom:0;left:0;right:0;background:#151b20ee;backdrop-filter:blur(10px);padding:13px;text-align:center;border-top:1px solid #ffffff14}
#add{background:#20a85c;font-size:16px}

/* Подводная атмосфера и медленное плавание */
body{background:radial-gradient(circle at 50% 0%,#39c5e955 0,#0b658e55 24%,transparent 52%),linear-gradient(180deg,#063d62 0%,#06304d 42%,#031c31 100%);position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;background:radial-gradient(circle at 20% 15%,#fff5 0 1px,transparent 2px),radial-gradient(circle at 75% 28%,#fff5 0 2px,transparent 3px),radial-gradient(circle at 40% 65%,#fff4 0 1px,transparent 2px);background-size:170px 190px,230px 260px,190px 220px;animation:particles 18s linear infinite}
body:after{content:"";position:fixed;inset:-20% -10%;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 120px,#8deaff12 121px 145px,transparent 146px 260px);filter:blur(12px);animation:light 16s ease-in-out infinite alternate}
@keyframes particles{to{transform:translateY(-120px)}}@keyframes light{to{transform:translateX(80px) translateY(30px)}}
.timer{position:relative;z-index:2;animation:swim var(--dur,18s) ease-in-out infinite alternate}
@keyframes swim{0%{transform:translate(0,0) rotate(-1deg)}25%{transform:translate(var(--x1),var(--y1)) rotate(1deg)}50%{transform:translate(var(--x2),var(--y2)) rotate(-1deg)}75%{transform:translate(var(--x3),var(--y3)) rotate(1deg)}100%{transform:translate(var(--x4),var(--y4)) rotate(-1deg)}}
.circle{background:radial-gradient(circle at 32% 22%,#fff8,transparent 18%),var(--empty);border:2px solid #c9f6ff99;box-shadow:inset 8px 10px 18px #fff2,inset -10px -12px 22px #001d2c99,0 10px 25px #00101d99}
.circle:after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid #fff4;pointer-events:none}
.fill{background:linear-gradient(180deg,#7cff9d,#36dd78 35%,#16bd63);position:absolute;left:-8%;right:-8%;bottom:0;height:100%;}
.fill:before{content:"";position:absolute;left:-5%;right:-5%;top:-8px;height:18px;border-radius:50%;background:#b9ffcbaa;filter:blur(1px)}
.bubble{position:fixed;bottom:-30px;border-radius:50%;border:1px solid #fff6;background:#ffffff10;box-shadow:inset 2px 2px 5px #fff5;pointer-events:none;z-index:1;animation:rise linear forwards}
@keyframes rise{to{transform:translate(var(--drift),-110vh) scale(1.25);opacity:0}}
</style>
</head>
<body>
<header><h1>Обратный отсчёт</h1><p>Задайте секунды в каждом кружке. Зелёная «жидкость» уменьшается до нуля.</p></header>
<main id="grid"></main>
<div class="controls"><button id="add">＋ Добавить кружок</button></div>
<script>
const grid=document.querySelector('#grid');
function random(min,max){return Math.round(Math.random()*(max-min)+min)}
function bubble(){const b=document.createElement('i');b.className='bubble';const s=random(4,14);b.style.width=s+'px';b.style.height=s+'px';b.style.left=random(2,98)+'vw';b.style.setProperty('--drift',random(-90,90)+'px');b.style.animationDuration=random(7,16)+'s';document.body.appendChild(b);setTimeout(()=>b.remove(),17000)}
setInterval(bubble,650);for(let i=0;i<15;i++)setTimeout(bubble,i*180);let id=0;
function addTimer(seconds=60){
  const el=document.createElement('section');el.className='timer';el.style.setProperty('--dur',random(13,24)+'s');for(let i=1;i<=4;i++){el.style.setProperty('--x'+i,random(-28,28)+'px');el.style.setProperty('--y'+i,random(-24,24)+'px')}
  el.innerHTML=`
    <div class="circle"><div class="fill"></div><div class="gloss"></div><div class="value">01:00</div></div>
    <input type="number" min="1" value="${seconds}" aria-label="секунды">
    <div><button class="start">Старт</button> <button class="reset">Сброс</button></div>`;
  grid.appendChild(el);
  const fill=el.querySelector('.fill'),value=el.querySelector('.value'),input=el.querySelector('input');
  let total=seconds,remain=seconds,timer=null;
  function render(){
    const m=Math.floor(remain/60),s=remain%60;
    value.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    fill.style.clipPath=`inset(${100-(remain/Math.max(total,1))*100}% 0 0 0)`;
  }
  el.querySelector('.start').onclick=()=>{
    if(timer) return;
    total=Math.max(1,parseInt(input.value)||1);remain=total;input.disabled=true;render();
    timer=setInterval(()=>{remain--;render();if(remain<=0){clearInterval(timer);timer=null;input.disabled=false;value.textContent='00:00'}},1000);
  };
  el.querySelector('.reset').onclick=()=>{if(timer){clearInterval(timer);timer=null}input.disabled=false;total=Math.max(1,parseInt(input.value)||1);remain=total;render()};
  input.onchange=()=>{if(!timer){total=Math.max(1,parseInt(input.value)||1);remain=total;render()}};
  render();
}
document.querySelector('#add').onclick=()=>addTimer(60);
for(let i=0;i<18;i++) addTimer(60);
</script>
</body>
</html>
