<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b100f"><title>Royal Tasbih 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Arial,sans-serif;background:#0a100e;color:#f7eedb}body{background:radial-gradient(ellipse at 50% 28%,#294039,#0c1714 54%,#070b0a)}.app{max-width:650px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:10px;letter-spacing:.22em;color:#c8ad73}.top h1{font-family:Georgia,serif;font-size:26px;font-weight:400;margin:3px 0}.back{font-size:12px;color:#d6c097;text-decoration:none;border:1px solid #b9a06d55;border-radius:12px;padding:10px}.scene{position:relative;flex:1;min-height:340px;max-height:700px;height:58dvh;overflow:hidden;touch-action:none}.scene canvas{width:100%;height:100%;display:block;touch-action:none}.scene:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 46%,#070e0c55 100%);z-index:1}.tip{position:absolute;top:12px;left:0;right:0;text-align:center;color:#c3b392;font-size:11px;letter-spacing:.1em;z-index:2;pointer-events:none}.toast{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-size:13px;color:#ecd59e;z-index:2;pointer-events:none;min-height:20px}.panel{margin:0 13px max(13px,env(safe-area-inset-bottom));border:1px solid #c2a57055;border-radius:24px;background:linear-gradient(145deg,#1b2d27f7,#101b17fa);box-shadow:0 15px 45px #0007;padding:16px}.count{display:flex;align-items:baseline;justify-content:center;gap:8px;font-variant-numeric:tabular-nums}.count b{font-size:56px;font-weight:600;line-height:1}.count span{color:#b9a57e;font-size:20px}.meta{text-align:center;font-size:12px;color:#b7aa90;margin:6px 0 16px}.mainbtn{display:block;width:100%;min-height:65px;border-radius:17px;background:linear-gradient(160deg,#f1d79f,#c9a466 60%,#a68148);color:#1b241f;border:1px solid #f6dda7;font-weight:750;font-size:20px;box-shadow:0 6px 20px #0006;touch-action:manipulation}.mainbtn:active{transform:scale(.985);filter:brightness(1.1)}button,select{font-family:inherit}.row{display:flex;gap:9px;margin-top:11px}.row>*{flex:1;min-width:0}.row button,.row select{background:#172820;border:1px solid #87764f91;border-radius:11px;color:#f2e5c9;min-height:43px;padding:8px;font-size:13px}.row button:active{background:#30473b}.hint{text-align:center;color:#a79c86;font-size:11px;margin:12px 0 0;line-height:1.45}.fallback{padding:40px 24px;text-align:center;color:#e5b994}.loading{position:absolute;top:50%;width:100%;text-align:center;color:#cdbb94;font-size:12px;pointer-events:none} @media(max-height:720px){.scene{min-height:250px;height:43dvh}.panel{padding:12px}.count b{font-size:43px}.mainbtn{min-height:53px}.top{padding-top:10px}}@media(max-width:350px){.top h1{font-size:22px}.row button,.row select{font-size:11px;padding:6px}}</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">ROYAL · TASBIH</div><h1>Живые чётки</h1></div><a class="back" href="./chetki2.html">← Основная</a></header><section class="scene" id="stage"><div class="tip">ПЕРЕБИРАЙТЕ БУСИНЫ ПАЛЬЦЕМ</div><div class="loading" id="loading">Загрузка 3D…</div><canvas id="canvas" aria-label="3D-чётки: одно касание или жест — один зикр"></canvas><div class="toast" id="toast"></div></section><section class="panel"><div class="count"><b id="count">0</b><span>/ <span id="target">33</span></span></div><div class="meta" id="meta">Круг 1 · 0 из 33</div><button class="mainbtn" id="tap">ЗИКР · +1</button><div class="row"><select id="stone" aria-label="Материал бусин"><option value="onyx">Чёрный оникс</option><option value="amber">Янтарь</option></select><select id="size" aria-label="Количество бусин"><option value="33">33 бусины</option><option value="99">99 бусин</option></select><button id="undo">↶ Назад</button><button id="reset">Сброс</button></div><p class="hint">Без раскручивания. Один жест — один зикр. Счётчик сохраняется автоматически.</p></section></main>
<script type="module">
const $=s=>document.querySelector(s),KEY='royal-tasbih-3d-v3';let state={count:0,stone:'onyx',size:33};try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');if(old&&typeof old==='object')state={...state,...old}}catch{}state.count=Math.max(0,Math.floor(Number(state.count)||0));state.size=Number(state.size)===99?99:33;state.stone=state.stone==='amber'?'amber':'onyx';$('#stone').value=state.stone;$('#size').value=String(state.size);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function paint(){$('#count').textContent=state.count;$('#target').textContent=state.size;$('#meta').textContent='Круг '+(Math.floor(state.count/state.size)+1)+' · '+(state.count%state.size)+' из '+state.size;save()}let scene,renderer,camera,root,beads=[],material,cord,THREE,progress=0,desired=0,flash=0,shake=0,last=0;
let toastTimeout=0;function toast(t){$('#toast').textContent=t;toastTimeout=performance.now()+1300}
function add(){state.count++;desired+=1/state.size;flash=1;shake=.045;paint();if(navigator.vibrate)navigator.vibrate(state.count%state.size===0?[20,45,30]:8);if(state.count%state.size===0)toast('Круг завершён')}
$('#tap').onclick=add;$('#undo').onclick=()=>{if(state.count){state.count--;desired-=1/state.size;paint()}};$('#reset').onclick=()=>{if(confirm('Сбросить счётчик?')){state.count=0;desired=0;progress=0;paint();toast('Сброшено')}};
$('#stone').onchange=e=>{state.stone=e.target.value;save();if(THREE)build()};
$('#size').onchange=e=>{state.size=Number(e.target.value);state.count=0;desired=0;progress=0;paint();if(THREE)build()};
const canvas=$('#canvas');let pointer=null;canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!pointer)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer=null;if(Math.hypot(dx,dy)<800)add()});canvas.addEventListener('pointercancel',()=>pointer=null);
function pos(t){const a=2*Math.PI*t;return new THREE.Vector3(2.45*Math.sin(a),3.03*Math.cos(a)-.18,.14*Math.cos(2*a))}
function texture(amber){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,512,512);if(amber){g.addColorStop(0,'#edb54c');g.addColorStop(.28,'#a7530d');g.addColorStop(.55,'#db8a26');g.addColorStop(1,'#72320b')}else{g.addColorStop(0,'#243239');g.addColorStop(.28,'#0b1014');g.addColorStop(.65,'#182327');g.addColorStop(1,'#05090c')}x.fillStyle=g;x.fillRect(0,0,512,512);let seed=7182;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<1800;i++){const xx=rnd()*512,yy=rnd()*512,r=rnd()*2+.2;x.fillStyle=amber?'rgba(255,223,151,'+(rnd()*.12)+')':'rgba(171,200,204,'+(rnd()*.045)+')';x.beginPath();x.arc(xx,yy,r,0,Math.PI*2);x.fill()}if(amber){for(let i=0;i<12;i++){x.strokeStyle='rgba(255,224,155,.10)';x.lineWidth=rnd()*4+1;x.beginPath();x.moveTo(rnd()*512,0);x.bezierCurveTo(rnd()*512,200,rnd()*512,300,rnd()*512,512);x.stroke()}}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function dispose(node){node.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){const a=Array.isArray(o.material)?o.material:[o.material];a.forEach(m=>{if(m.map)m.map.dispose();m.dispose()})}})}
function build(){if(root){scene.remove(root);dispose(root)}root=new THREE.Group();scene.add(root);beads=[];const amber=state.stone==='amber';const stone=new THREE.MeshPhysicalMaterial({map:texture(amber),color:0xffffff,metalness:amber?0:.12,roughness:amber?.16:.105,clearcoat:1,clearcoatRoughness:.055,transmission:amber?.09:0,thickness:1.5,ior:1.5});
const gold=new THREE.MeshStandardMaterial({color:0xc5a46d,metalness:.84,roughness:.23});const string=new THREE.MeshStandardMaterial({color:0x776143,roughness:.88});
const curve=new THREE.CatmullRomCurve3(Array.from({length:240},(_,i)=>pos(i/240)),true,'centripetal');cord=new THREE.Mesh(new THREE.TubeGeometry(curve,400,.038,8,true),string);root.add(cord);
const n=state.size,rad=n===99?.18:.27,len=n===99?.23:.35;const geo=new THREE.SphereGeometry(1,n===99?16:40,n===99?12:30);const rimGeo=new THREE.TorusGeometry(rad*.27,rad*.055,7,16);
for(let i=0;i<n;i++){const node=new THREE.Group();const gem=new THREE.Mesh(geo,stone);gem.scale.set(rad,len,rad);node.add(gem);for(const side of [-1,1]){const rim=new THREE.Mesh(rimGeo,gold);rim.rotation.x=Math.PI/2;rim.position.y=side*len;node.add(rim)}root.add(node);beads.push(node)}
const join=new THREE.Mesh(new THREE.SphereGeometry(.18,24,16),gold);join.position.set(0,-3.36,.02);root.add(join);const cap=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.55,16),gold);cap.position.set(0,-3.68,.02);root.add(cap);const silk=new THREE.MeshStandardMaterial({color:0xd6b777,metalness:.22,roughness:.68});for(let i=0;i<26;i++){const a=i*2.4,r=.04+.09*Math.sqrt(i/26);const strand=new THREE.Mesh(new THREE.CylinderGeometry(.008,.004,.62,5),silk);strand.position.set(Math.cos(a)*r,-4.16,Math.sin(a)*r);strand.rotation.z=Math.cos(a)*.11;root.add(strand)}
setPositions()}
const up=new THREE.Vector3(0,1,0);function setPositions(){for(let i=0;i<beads.length;i++){const t=((i/state.size-progress)%1+1)%1,p=pos(t),v=pos((t+.0002)%1).sub(p).normalize(),b=beads[i];b.position.copy(p);b.quaternion.setFromUnitVectors(up,v)}}
async function start(){try{THREE=await Promise.race([import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js').catch(()=>import('https://unpkg.com/three@0.180.0/build/three.module.js')),new Promise((_,reject)=>setTimeout(()=>reject(new Error('3D module timeout')),12000))]);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(34,1,.1,100);renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.6;renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));scene.add(new THREE.HemisphereLight(0xe8f0e9,0x18201b,2.4));const lights=[[0xffe3b3,110,-4,5,7],[0xffffff,80,4,1,5],[0x8ac6b4,45,-5,-2,-3]];for(const [color,power,x,y,z] of lights){const l=new THREE.PointLight(color,power,22,1.5);l.position.set(x,y,z);scene.add(l)}
build();$('#loading').remove();const resize=()=>{const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.set(0,-.22,w<440?8.7:9.5);camera.updateProjectionMatrix()};new ResizeObserver(resize).observe(canvas);resize();
function render(time){requestAnimationFrame(render);const dt=Math.min((time-last)||16,40);last=time;const d=desired-progress;progress+=Math.sign(d)*Math.min(Math.abs(d),dt*.00028);shake*=.88;flash*=.92;root.rotation.y=Math.sin(time*.00018)*.025;root.rotation.x=-.055;root.position.y=Math.sin(time*.0012)*.014;setPositions();if(toastTimeout&&time>toastTimeout){$('#toast').textContent='';toastTimeout=0}renderer.render(scene,camera)}requestAnimationFrame(render)
}catch(err){$('#loading').innerHTML='3D не удалось загрузить. Счётчик работает ниже.<div style="margin-top:12px"><button id="retry3d" style="padding:12px 20px;background:#d0af74;color:#16231d;border:0;border-radius:12px">Повторить загрузку</button></div>';$('#retry3d').onclick=()=>location.reload();console.error(err)}}
paint();start();
</script></body></html>
