<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c0b"><title>Чётки 3D — прототип</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial;background:#080c0b;color:#f7edcf}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 32%,#174238,#080c0b 72%)}header{display:flex;justify-content:space-between;align-items:center;padding:18px;gap:12px}a{color:#e9c77b;text-decoration:none}h1{font-size:22px;margin:0}small{color:#b5a986}.app{max-width:700px;margin:auto}canvas{display:block;width:100%;height:min(61dvh,550px);touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.panel{margin:0 14px 22px;padding:17px;border:1px solid #76643d88;background:#0c1614dc;border-radius:22px}.count{font-size:48px;font-weight:750;text-align:center;line-height:1.2}.sub{text-align:center;color:#c6b48e;font-size:13px;margin:5px 0 16px}button,select{border:1px solid #8b7446;background:#182822;color:#f7edcf;border-radius:12px;padding:12px 10px;font-size:14px}button{cursor:pointer}button:active{transform:scale(.97)}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.options{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}.options select{flex:1;min-width:0}.hint{font-size:12px;color:#aa9f83;text-align:center;margin-top:13px}.notice{font-size:12px;color:#e6cf93;text-align:center;margin-top:8px} @media(max-width:370px){button,select{font-size:12px;padding:10px 7px}}
</style></head><body><div class="app"><header><div><small>ЭКСПЕРИМЕНТАЛЬНАЯ ВЕРСИЯ</small><h1>Чётки 3D</h1></div><a href="./chetki2.html">← Основная версия</a></header><canvas id="scene" aria-label="Трёхмерные чётки"></canvas><div class="panel"><div class="options"><label for="material">Материал</label><select id="material"><option value="amber">Янтарь</option><option value="onyx">Чёрный оникс</option><option value="emerald">Изумруд</option><option value="wood">Дерево</option></select></div><div class="count" id="count">0</div><div class="sub" id="goal">из 33 повторений</div><div class="buttons"><button id="undo">↶ Назад</button><button id="tap">+1 Зикр</button><button id="reset">Сброс</button></div><div class="hint">Медленно проведите пальцем по чёткам — бусины будут скользить по нити. Можно также нажать «+1 Зикр».</div><div class="notice" id="status"></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const canvas=document.querySelector('#scene'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,100),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.65;camera.position.set(0,0,12.5);scene.add(new THREE.HemisphereLight(0xf8e6bc,0x16372d,2.2));const light=new THREE.DirectionalLight(0xffffff,3.5);light.position.set(-3,5,8);scene.add(light);const rim=new THREE.PointLight(0xf3c46c,70);rim.position.set(3,-3,4);scene.add(rim);
const group=new THREE.Group();scene.add(group);const sphere=new THREE.SphereGeometry(.315,48,32);const gold=new THREE.MeshStandardMaterial({color:0xc69c4b,metalness:.82,roughness:.22});const thread=new THREE.MeshStandardMaterial({color:0xa48244,metalness:.5,roughness:.5});const palettes={amber:[0xa64b08,.05,.12],onyx:[0x090d10,.12,.095],emerald:[0x06452f,.12,.12],wood:[0x633416,0,.56]};let beads=[],count=0,angle=0,velocity=0,dragging=false,moved=false,lastX=0,lastY=0,travel=0,dragTotal=0,beadOffset=0,targetOffset=0,cord=null;const STEP=44;const N=33;function point(t){const a=t*Math.PI*2;const x=3.12*Math.sin(a),y=2.8*Math.cos(a)-.05;return new THREE.Vector3(x,y,.18*Math.cos(a*2)+.07*Math.sin(a*3))}
function build(){while(group.children.length)group.remove(group.children[0]);beads=[];const [color,metalness,roughness]=palettes[document.querySelector('#material').value];const mat=new THREE.MeshPhysicalMaterial({color,metalness,roughness,clearcoat:1,clearcoatRoughness:.08,transmission:document.querySelector('#material').value==='amber'?.14:0,thickness:1.5,ior:1.48});const path=Array.from({length:132},(_,i)=>point(i/132));const curve=new THREE.CatmullRomCurve3(path,true,'centripetal');cord=new THREE.Mesh(new THREE.TubeGeometry(curve,240,.052,10,true),new THREE.MeshStandardMaterial({color:0x6a4c29,roughness:.86}));group.add(cord);
for(let i=0;i<N;i++){const bead=new THREE.Group();const core=new THREE.Mesh(sphere,i%11===0?gold:mat);core.scale.set(.87,1.14,.88);bead.add(core);const bore=new THREE.Mesh(new THREE.TorusGeometry(.074,.019,8,20),gold);bore.position.y=.361;bore.rotation.x=Math.PI/2;bead.add(bore);const bore2=bore.clone();bore2.position.y=-.361;bead.add(bore2);bead.userData.index=i;group.add(bead);beads.push(bead)}
const collar=new THREE.Mesh(new THREE.SphereGeometry(.18,24,16),gold);collar.position.set(0,-3.08,.1);group.add(collar);const stalk=new THREE.Mesh(new THREE.CylinderGeometry(.075,.1,.65,16),gold);stalk.position.set(0,-3.46,.1);group.add(stalk);for(let i=0;i<18;i++){const a=i*Math.PI*2/18;const thread=new THREE.Mesh(new THREE.CylinderGeometry(.012,.009,.68,6),new THREE.MeshStandardMaterial({color:i%2?0xb88c40:0xdbc079,roughness:.48}));thread.position.set(Math.sin(a)*.1,-4.03,Math.cos(a)*.1);thread.rotation.z=Math.sin(a)*.12;group.add(thread)}
beadOffset=0;targetOffset=0;paint()}
function paint(){document.querySelector('#count').textContent=count;document.querySelector('#goal').textContent='из 33 повторений · круг '+(Math.floor(count/33)+1);beads.forEach((b,i)=>{b.scale.setScalar(i===0?1.025:1)})}
function increment(){count++;targetOffset+=1/N;if(navigator.vibrate)navigator.vibrate(count%33===0?[30,40,60]:9);paint();document.querySelector('#status').textContent=count%33===0?'Круг завершён!':''}
document.querySelector('#tap').onclick=increment;document.querySelector('#undo').onclick=()=>{if(count>0){count--;targetOffset-=1/N}paint()};document.querySelector('#reset').onclick=()=>{if(confirm('Сбросить счётчик?')){count=0;targetOffset=0;paint()}};document.querySelector('#material').onchange=build;
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let downAt=0,lastCountAt=0,swipeDistance=0,gestureMoved=false;
canvas.addEventListener('pointerdown',e=>{dragging=true;moved=false;gestureMoved=false;downAt=performance.now();lastCountAt=0;lastX=e.clientX;lastY=e.clientY;travel=0;dragTotal=0;swipeDistance=0;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;dragTotal+=Math.abs(dx)+Math.abs(dy);if(dragTotal<12)return;moved=true;gestureMoved=true;const dist=Math.hypot(dx,dy);swipeDistance+=dist;travel+=dist;const now=performance.now();if(travel>=44&&now-lastCountAt>=130){increment();travel=0;lastCountAt=now}});
canvas.addEventListener('pointerup',e=>{dragging=false;if(gestureMoved)return;const rect=canvas.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-((e.clientY-rect.top)/rect.height*2-1));raycaster.setFromCamera(pointer,camera);if(raycaster.intersectObjects(beads,true).length)increment()});
canvas.addEventListener('pointercancel',()=>{dragging=false});
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();camera.position.z=w<420?14.6:12.5}new ResizeObserver(resize).observe(canvas);build();function animate(){requestAnimationFrame(animate);velocity=0;angle*=.92;group.rotation.y=angle;group.rotation.x=-.12+Math.sin(angle*.5)*.08;const remaining=targetOffset-beadOffset;beadOffset+=Math.sign(remaining)*Math.min(Math.abs(remaining),.012);beads.forEach((b,i)=>{const t=((i/N-beadOffset)%1+1)%1;const p=point(t),p2=point((t+.001)%1);b.position.copy(p);const tangent=p2.sub(p).normalize();b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),tangent);b.rotation.y+=Math.sin(Date.now()*.001+i)*.0005});renderer.render(scene,camera)}animate();
</script></body></html>
