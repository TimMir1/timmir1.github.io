<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c0b"><title>Чётки 3D — прототип</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial;background:#080c0b;color:#f7edcf}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 32%,#174238,#080c0b 72%)}header{display:flex;justify-content:space-between;align-items:center;padding:18px;gap:12px}a{color:#e9c77b;text-decoration:none}h1{font-size:22px;margin:0}small{color:#b5a986}.app{max-width:700px;margin:auto}canvas{display:block;width:100%;height:min(61dvh,550px);touch-action:manipulation}.panel{margin:0 14px 22px;padding:17px;border:1px solid #76643d88;background:#0c1614dc;border-radius:22px}.count{font-size:48px;font-weight:750;text-align:center;line-height:1.2}.sub{text-align:center;color:#c6b48e;font-size:13px;margin:5px 0 16px}button,select{border:1px solid #8b7446;background:#182822;color:#f7edcf;border-radius:12px;padding:12px 10px;font-size:14px}button{cursor:pointer}button:active{transform:scale(.97)}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.options{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}.options select{flex:1;min-width:0}.hint{font-size:12px;color:#aa9f83;text-align:center;margin-top:13px}.notice{font-size:12px;color:#e6cf93;text-align:center;margin-top:8px} @media(max-width:370px){button,select{font-size:12px;padding:10px 7px}}
</style></head><body><div class="app"><header><div><small>ЭКСПЕРИМЕНТАЛЬНАЯ ВЕРСИЯ</small><h1>Чётки 3D</h1></div><a href="./chetki2.html">← Основная версия</a></header><canvas id="scene" aria-label="Трёхмерные чётки"></canvas><div class="panel"><div class="options"><label for="material">Материал</label><select id="material"><option value="amber">Янтарь</option><option value="onyx">Чёрный оникс</option><option value="emerald">Изумруд</option><option value="wood">Дерево</option></select></div><div class="count" id="count">0</div><div class="sub" id="goal">из 33 повторений</div><div class="buttons"><button id="undo">↶ Назад</button><button id="tap">+1 Зикр</button><button id="reset">Сброс</button></div><div class="hint">Коснитесь бусины или кнопки, чтобы считать. Проведите пальцем по чёткам, чтобы вращать их.</div><div class="notice" id="status"></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const canvas=document.querySelector('#scene'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,100),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.65;camera.position.set(0,0,13.5);scene.add(new THREE.HemisphereLight(0xf8e6bc,0x16372d,2.2));const light=new THREE.DirectionalLight(0xffffff,3.5);light.position.set(-3,5,8);scene.add(light);const rim=new THREE.PointLight(0xf3c46c,70);rim.position.set(3,-3,4);scene.add(rim);
const group=new THREE.Group();scene.add(group);const sphere=new THREE.SphereGeometry(.32,32,24);const gold=new THREE.MeshStandardMaterial({color:0xc69c4b,metalness:.82,roughness:.22});const thread=new THREE.MeshStandardMaterial({color:0xa48244,metalness:.5,roughness:.5});const palettes={amber:[0xa7550e,.14,.18],onyx:[0x101a1b,.2,.22],emerald:[0x08634d,.25,.2],wood:[0x6a3719,0,.7]};let beads=[],count=0,angle=0,velocity=0,dragging=false,moved=false,lastX=0;
function build(){while(group.children.length)group.remove(group.children[0]);beads=[];const [color,metalness,roughness]=palettes[document.querySelector('#material').value];const mat=new THREE.MeshPhysicalMaterial({color,metalness,roughness,clearcoat:.9,clearcoatRoughness:.12});const path=[];for(let i=0;i<33;i++){const a=i*Math.PI*2/33;path.push(new THREE.Vector3(Math.cos(a)*3.25,Math.sin(a)*3.25*.92,Math.sin(a*2)*.24));}const curve=new THREE.CatmullRomCurve3([...path,path[0],path[1]],true);const cord=new THREE.Mesh(new THREE.TubeGeometry(curve,160,.055,7,true),thread);group.add(cord);path.forEach((p,i)=>{const b=new THREE.Mesh(sphere,i%11===0?gold:mat);b.position.copy(p);b.userData.index=i;group.add(b);beads.push(b)});const stem=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,.7,12),gold);stem.position.set(0,-3.35,0);group.add(stem);const tassel=new THREE.Mesh(new THREE.ConeGeometry(.25,.9,16),gold);tassel.rotation.z=Math.PI;tassel.position.set(0,-4,0);group.add(tassel);paint()}
function paint(){document.querySelector('#count').textContent=count;document.querySelector('#goal').textContent='из 33 повторений · круг '+(Math.floor(count/33)+1);beads.forEach((b,i)=>{const active=i<count%33;b.scale.setScalar(active?1.18:1);b.material.emissive?.setHex(active?0x6e4716:0);b.material.emissiveIntensity=active?.28:0})}
function increment(){count++;velocity+=.045;if(navigator.vibrate)navigator.vibrate(count%33===0?[30,40,60]:9);paint();document.querySelector('#status').textContent=count%33===0?'Круг завершён!':''}
document.querySelector('#tap').onclick=increment;document.querySelector('#undo').onclick=()=>{count=Math.max(0,count-1);paint()};document.querySelector('#reset').onclick=()=>{if(confirm('Сбросить счётчик?')){count=0;paint()}};document.querySelector('#material').onchange=build;
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();canvas.addEventListener('pointerdown',e=>{dragging=true;moved=false;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX;if(Math.abs(dx)>3)moved=true;angle+=dx*.008;velocity=dx*.001;lastX=e.clientX});canvas.addEventListener('pointerup',e=>{dragging=false;if(moved)return;const rect=canvas.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-((e.clientY-rect.top)/rect.height*2-1));raycaster.setFromCamera(pointer,camera);if(raycaster.intersectObjects(beads).length)increment()});function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();camera.position.z=w<420?16:13.5}new ResizeObserver(resize).observe(canvas);build();function animate(){requestAnimationFrame(animate);if(!dragging){angle+=velocity;velocity*=.93}group.rotation.y=angle;group.rotation.x=-.12+Math.sin(angle*.5)*.08;renderer.render(scene,camera)}animate();
</script></body></html>
