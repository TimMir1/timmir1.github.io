<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1110"><title>Чётки 3D — реалистичные</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09110f;color:#f2e8d3;font-family:system-ui,-apple-system,Arial,sans-serif}body{background:radial-gradient(ellipse at 50% 33%,#213a31 0%,#101c18 48%,#080e0d 100%)}main{max-width:620px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{padding:18px 18px 5px;display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{color:#b8a277;font-size:10px;letter-spacing:.19em;font-weight:700}.top h1{margin:3px 0;font-size:23px;letter-spacing:.01em}.back{font-size:12px;color:#e8c88b;text-decoration:none;border:1px solid #7968446e;border-radius:10px;padding:10px}.stage{position:relative;flex:1;min-height:340px;height:min(62dvh,620px);max-height:680px;overflow:hidden}.stage:after{content:"";pointer-events:none;position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,#08100d45 100%)}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.stage-label{position:absolute;top:15px;left:0;right:0;text-align:center;color:#bcae90;font-size:11px;letter-spacing:.13em;pointer-events:none}.feedback{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#e8d6ad;font-size:13px;pointer-events:none;min-height:20px}.panel{margin:0 14px max(14px,env(safe-area-inset-bottom));padding:16px 16px 14px;background:linear-gradient(160deg,#192a25f5,#0c1613fa);border:1px solid #8e784850;border-radius:22px;box-shadow:0 14px 40px #0005}.settings{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;color:#c4b48f;font-size:11px;margin:0 0 5px}select,button{font:inherit;color:#f1e7d1;border:1px solid #7f704e85;background:#172720;border-radius:11px;min-height:42px;padding:9px 10px}select{width:100%;font-size:14px}button{cursor:pointer}button:active{transform:scale(.98)}.counter{text-align:center;padding:10px 0 13px}.number{font-size:52px;line-height:1.05;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.035em}.number small{font-size:19px;color:#c0ac7e;font-weight:400}.sub{font-size:12px;color:#c0b294;margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1.55fr 1fr;gap:8px}.primary{background:linear-gradient(#d9b978,#a78346);border-color:#ebd09a;color:#1a211c;font-weight:800}.hint{text-align:center;font-size:11px;color:#a89f8c;margin:12px 0 0;line-height:1.45}.error{padding:25px;color:#e8bc91;text-align:center}
@media(max-height:710px){.stage{height:44dvh;min-height:255px}.top{padding-top:10px}.panel{padding:12px}.number{font-size:42px}.counter{padding:5px 0 9px}}@media(max-width:350px){.top h1{font-size:19px}.actions button{font-size:12px;padding:7px}}
</style></head><body><main><header class="top"><div><div class="eyebrow">ROYAL TASBIH · 3D</div><h1>Чётки</h1></div><a class="back" href="./chetki2.html">← Основная версия</a></header>
<section class="stage" id="stage"><div class="stage-label">ПЕРЕБИРАЙТЕ БУСИНЫ ПАЛЬЦЕМ</div><canvas id="scene" aria-label="Интерактивные трёхмерные чётки"></canvas><div class="feedback" id="feedback" aria-live="polite"></div></section>
<section class="panel"><div class="settings"><div><label for="material">Камень</label><select id="material"><option value="onyx">Чёрный оникс</option><option value="amber">Медовый янтарь</option></select></div><div><label for="total">Количество бусин</label><select id="total"><option value="33">33 бусины</option><option value="99">99 бусин</option></select></div></div>
<div class="counter"><div class="number"><span id="count">0</span> <small>/ <span id="target">33</span></small></div><div class="sub" id="round">Круг 1 · Субханаллах</div></div><div class="actions"><button id="undo">↶ Назад</button><button class="primary" id="tap">+1 зикр</button><button id="reset">Сброс</button></div><p class="hint">Один осознанный жест по бусинам — одно повторение. Быстрый свайп не раскручивает чётки.</p></section></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=s=>document.querySelector(s),canvas=$('#scene'),storageKey='tasbih-realistic-3d-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
let count=Math.max(0,Number(saved.count)||0),total=[33,99].includes(Number(saved.total))?Number(saved.total):33,material=saved.material==='amber'?'amber':'onyx';
$('#material').value=material;$('#total').value=String(total);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,100);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.32;renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
scene.add(new THREE.HemisphereLight(0xd9e7e1,0x1b211d,2.0));
function light(color,power,x,y,z){const l=new THREE.PointLight(color,power,25,1.6);l.position.set(x,y,z);scene.add(l)}
light(0xffe0aa,80,-3,5,6);light(0xffffff,55,4,1,5);light(0x7eb9a9,40,-4,-3,-2);
const group=new THREE.Group();scene.add(group);
const metal=new THREE.MeshStandardMaterial({color:0xcba767,metalness:.82,roughness:.24});
const cordMat=new THREE.MeshStandardMaterial({color:0x76613f,roughness:.96,metalness:0});
const onyx=new THREE.MeshPhysicalMaterial({color:0x111819,metalness:.15,roughness:.09,clearcoat:1,clearcoatRoughness:.055});
const amber=new THREE.MeshPhysicalMaterial({color:0xb66b18,metalness:0,roughness:.1,transmission:.24,thickness:1.2,ior:1.5,clearcoat:1,clearcoatRoughness:.04,attenuationColor:0xc66b16,attenuationDistance:1.5});
const sphere=new THREE.SphereGeometry(1,32,24);
const beadNodes=[];let cordMesh=null,shift=0,shiftGoal=0,impulse=0,down=null,dragStarted=false,gestureCounted=false;
function path(t){const a=t*Math.PI*2;return new THREE.Vector3(2.4*Math.sin(a),3.15*Math.cos(a)-.15,.24*Math.cos(a*2)-.1)}
function positionBead(obj,t){const p=path(t),next=path((t+.0001)%1);obj.position.copy(p);const tangent=next.sub(p).normalize();obj.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),tangent)}
function clearGroup(){while(group.children.length){const o=group.children[0];group.remove(o);if(o.geometry)o.geometry.dispose();if(o!==cordMesh&&o.material&&o.material!==metal&&o.material!==cordMat&&o.material!==onyx&&o.material!==amber)o.material.dispose()}beadNodes.length=0}
function makeBead(i){const node=new THREE.Group();const stone=new THREE.Mesh(sphere,material==='amber'?amber:onyx);stone.scale.set(.24,total===99?.30:.37,.24);node.add(stone);
const radius=.077;for(const side of [-1,1]){const ring=new THREE.Mesh(new THREE.TorusGeometry(radius,.018,8,20),metal);ring.rotation.x=Math.PI/2;ring.position.y=side*(total===99?.3:.37);node.add(ring)}
node.userData.bead=true;node.userData.index=i;group.add(node);beadNodes.push(node)}
function make(){clearGroup();const pts=Array.from({length:180},(_,i)=>path(i/180));const curve=new THREE.CatmullRomCurve3(pts,true,'centripetal');cordMesh=new THREE.Mesh(new THREE.TubeGeometry(curve,320,.038,8,true),cordMat);group.add(cordMesh);
for(let i=0;i<total;i++)makeBead(i);
const bead=new THREE.Mesh(new THREE.SphereGeometry(.2,24,16),metal);bead.position.set(0,-3.42,0);group.add(bead);
const stem=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,.56,16),metal);stem.position.set(0,-3.74,0);group.add(stem);
const fiberMat=new THREE.MeshStandardMaterial({color:0xd0ad6d,metalness:.35,roughness:.54});for(let i=0;i<24;i++){const a=i*2.39996,r=.04+.095*Math.sqrt(i/24);const fiber=new THREE.Mesh(new THREE.CylinderGeometry(.007,.005,.65+Math.sin(i*9)*.1,5),fiberMat);fiber.position.set(Math.cos(a)*r,-4.22,Math.sin(a)*r);fiber.rotation.z=Math.cos(a)*.16;group.add(fiber)}
shift=0;shiftGoal=0;updatePositions()}
function updatePositions(){for(let i=0;i<beadNodes.length;i++)positionBead(beadNodes[i],((i/total-shift)%1+1)%1)}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({count,total,material}))}catch{}}
function paint(){ $('#count').textContent=count;$('#target').textContent=total;$('#round').textContent='Круг '+(Math.floor(count/total)+1)+' · '+(count%total)+' из '+total;persist()}
let noticeUntil=0;function notify(t){$('#feedback').textContent=t;noticeUntil=performance.now()+1100}
function tick(){count++;shiftGoal+=1/total;paint();if(navigator.vibrate)navigator.vibrate(count%total===0?[22,40,35]:12);if(count%total===0)notify('Круг завершён')}
$('#tap').addEventListener('click',tick);
$('#undo').addEventListener('click',()=>{if(count){count--;shiftGoal-=1/total;paint()}});
$('#reset').addEventListener('click',()=>{if(confirm('Сбросить счётчик?')){count=0;shiftGoal=0;paint();notify('Счётчик сброшен')}});
$('#material').addEventListener('change',e=>{material=e.target.value;make();persist()});
$('#total').addEventListener('change',e=>{total=Number(e.target.value);count=0;make();paint()});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function hit(e){const r=canvas.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);return ray.intersectObjects(beadNodes,true).length>0}
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,time:performance.now(),hit:hit(e)};dragStarted=false;gestureCounted=false;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!down)return;const d=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(d>12)dragStarted=true;if(!gestureCounted&&down.hit&&d>35){gestureCounted=true;tick();impulse=1}});
canvas.addEventListener('pointerup',e=>{if(!down)return;if(!gestureCounted&&!dragStarted&&down.hit){tick();impulse=1}down=null});
canvas.addEventListener('pointercancel',()=>down=null);
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.set(0,.0,w<440?17:15);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas);
function frame(){requestAnimationFrame(frame);const delta=shiftGoal-shift;shift+=Math.sign(delta)*Math.min(Math.abs(delta),.0035);impulse*=.9;group.rotation.y=Math.sin(performance.now()*.0003)*.035;group.rotation.x=-.075;updatePositions();if(noticeUntil&&performance.now()>noticeUntil){$('#feedback').textContent='';noticeUntil=0}renderer.render(scene,camera)}
make();paint();resize();frame();
</script></body></html>
