<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мира — Планер недели</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#49384d;background:linear-gradient(135deg,#fff8fc,#f3efff)}.app{max-width:1400px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.title h1{margin:0;font-size:34px}.title p{color:#8d7890}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer;background:#fff;color:#8d63c7}.primary{background:linear-gradient(135deg,#f7a9cf,#c99cf1);color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}.board,.panel{background:#ffffffee;border:1px solid #ead8e6;border-radius:24px;box-shadow:0 15px 45px #72507014}.board{padding:18px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.day{border:1px solid #ead8e6;border-radius:18px;background:#fff;min-height:430px;display:flex;flex-direction:column;overflow:hidden}.day.selected{box-shadow:inset 0 0 0 3px #f7b4d7}.dayhead{text-align:center;padding:12px 5px;background:#fff0f8;cursor:pointer}.dayhead b{display:block}.dayhead small{color:#9b8299}.slots{padding:9px;display:flex;flex-direction:column;gap:8px;flex:1}.token{position:relative;display:flex;align-items:center;gap:8px;padding:7px;border-radius:13px;background:#fff7fb;border:1px solid #f0d8e7;cursor:pointer}.token .pic{width:58px;height:58px;flex:none}.pic{display:block;object-fit:contain;object-position:center;border-radius:11px;background:#fff}.token span{font-size:12px;font-weight:750}.token.done{background:#eaf9ef;text-decoration:line-through;opacity:.8}.token button{position:absolute;right:3px;top:3px;border:0;background:transparent;color:#b18aaa;cursor:pointer}.empty{border:2px dashed #ead9e6;color:#c0a9bc;border-radius:13px;padding:16px 5px;text-align:center;font-size:12px;margin-top:auto}.panel{padding:20px}.panel h2{margin:0}.panel p{color:#947f92;font-size:13px}.library{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.lib{border:1px solid #ead8e6;background:#fff;border-radius:15px;padding:7px 5px;cursor:pointer;text-align:center}.lib .pic{width:82px;height:70px;margin:auto}.lib small{font-size:10px;display:block;margin-top:5px}.custom{margin-top:16px;padding-top:16px;border-top:1px solid #ead8e6}input,select{width:100%;padding:11px;border:1px solid #ead8e6;border-radius:12px;margin:6px 0 9px;font:inherit;box-sizing:border-box}.actions{display:flex;gap:8px;margin-top:12px}.stars{text-align:center;margin-top:18px;padding:15px;border-radius:18px;background:#fff5bf;color:#8d6d2c}.stars strong{font-size:28px}.footer{text-align:center;margin:18px;color:#a28da0;font-size:12px}.err{display:none;background:#fff0f0;color:#a33;padding:8px;border-radius:10px;font-size:11px;margin-top:5px}@media(max-width:950px){.layout{grid-template-columns:1fr}.week{overflow-x:auto;grid-template-columns:repeat(7,155px)}.panel{order:-1}}@media print{body{background:#fff}.head,.panel,.footer,.stars{display:none}.board{box-shadow:none;border:0;padding:0}.day{min-height:260mm;border-radius:4px}}</style></head><body><main class="app"><header class="head"><div class="title"><h1>Мира — моя неделя</h1><p>Выбери день и добавляй картинки Миры.</p></div><div><button class="btn" onclick="resetWeek()">Новая неделя</button> <button class="btn primary" onclick="window.print()">Печать A4</button></div></header><section class="layout"><div><div class="board"><div id="week" class="week"></div></div><div class="stars">Выполнено: <strong id="stars">0</strong></div></div><aside class="panel"><h2>Картинки Миры</h2><p>Нажми на картинку — она добавится в выбранный день.</p><div id="library" class="library"></div><div class="custom"><b>Свой жетон</b><input id="customName" placeholder="Например: помочь маме"><select id="customPic"></select><button class="btn primary" style="width:100%" onclick="addCustom()">Добавить</button></div><div class="actions"><button class="btn" onclick="save()">Сохранить</button><button class="btn" onclick="load()">Загрузить</button></div><p>Клик по дню выбирает день. Клик по картинке отмечает её выполненной. × удаляет.</p></aside></section><div class="footer">Планер «Мира» · A4</div></main><script>const ROOT='https://raw.githubusercontent.com/TimMir1/timmir1.github.io/main/';const base=[['Проснуться','01_prosnutsya.png'],['Завтрак','02_zavtrak.png'],['Одеться','03_odetsya.png'],['В садик','04_v_sadik.png'],['Бассейн','05_basseyn.png'],['Площадка','06_ploshchadka.png'],['Рисовать','07_risovat.png'],['Читать','08_chitat.png'],['Убрать игрушки','09_ubrat_igrushki.png'],['Ванна','10_vanna.png'],['Чистить зубы','11_chistit_zuby.png'],['Прогулка','12_progulka.png'],['Танцы','13_tantsy.png'],['Мультик','14_multik.png'],['Магазин','15_magazin.png'],['Ужин','16_uzhin.png'],['Сон','17_son.png'],['Я молодец!','18_ya_molodets.png']];let tokens=JSON.parse(localStorage.getItem('miraTokens')||'null')||base;let week=JSON.parse(localStorage.getItem('miraWeek')||'null')||Array.from({length:7},()=>[]);let selected=0;function path(p){return p.startsWith('http')?p:ROOT+p}function migrate(){if(tokens.length&&typeof tokens[0][1]==='number')tokens=tokens.map(t=>[t[0],base[t[1]]?.[1]||base[0][1]]);week=week.map(day=>day.map(t=>{if(typeof t.p==='number')t.p=base[t.p]?.[1]||base[0][1];return t}))}migrate();const days=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];function bad(e){e.target.style.display='none';const x=document.createElement('div');x.className='err';x.textContent='Не загрузилась: '+e.target.getAttribute('src');e.target.parentElement.appendChild(x)}function render(){library.innerHTML=tokens.map((t,i)=>`<button class="lib" onclick="add(${i})"><img class="pic" src="${path(t[1])}?v=4" alt="${t[0]}" onerror="bad(event)"><small>${t[0]}</small></button>`).join('');customPic.innerHTML=base.map(t=>`<option value="${t[1]}">${t[0]}</option>`).join('');document.getElementById('week').innerHTML=days.map((d,i)=>`<div class="day ${i===selected?'selected':''}"><div class="dayhead" onclick="selected=${i};render()"><b>${d}</b><small>${i===selected?'выбран':'выбрать'}</small></div><div class="slots">${week[i].map((t,j)=>`<div class="token ${t.done?'done':''}" onclick="toggle(${i},${j})"><img class="pic" src="${path(t.p)}?v=4" alt="${t.n}" onerror="bad(event)"><span>${t.n}</span><button onclick="event.stopPropagation();del(${i},${j})">×</button></div>`).join('')||'<div class="empty">Нажми на картинку<br>справа →</div>'}</div></div>`).join('');stars.textContent=week.flat().filter(x=>x.done).length}function add(i){week[selected].push({p:tokens[i][1],n:tokens[i][0],done:false});save();render()}function toggle(i,j){week[i][j].done=!week[i][j].done;save();render()}function del(i,j){week[i].splice(j,1);save();render()}function addCustom(){let n=customName.value.trim(),p=customPic.value;if(!n)return;tokens.push([n,p]);customName.value='';save();render()}function save(){localStorage.setItem('miraWeek',JSON.stringify(week));localStorage.setItem('miraTokens',JSON.stringify(tokens))}function load(){week=JSON.parse(localStorage.getItem('miraWeek')||'null')||Array.from({length:7},()=>[]);tokens=JSON.parse(localStorage.getItem('miraTokens')||'null')||base;migrate();render()}function resetWeek(){if(confirm('Очистить всю неделю?')){week=Array.from({length:7},()=>[]);save();render()}}render();</script></body></html>
