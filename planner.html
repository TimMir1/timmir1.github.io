<!doctype html>
<html lang="ru">
<head>

<style>
:root{--pink:#f39ac9;--purple:#a982df;--ink:#49384d;--muted:#927d91;--line:#ead8e6;--bg:#faf6fb}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff9fc,#f4efff);min-height:100vh}.app{max-width:1450px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.title h1{margin:0;font-size:34px;line-height:1.1}.title p{margin:7px 0 0;color:var(--muted)}.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;cursor:pointer;background:#fff;color:#8d63c7;box-shadow:0 4px 14px #72507012}.primary{background:linear-gradient(135deg,#f7a9cf,#c99cf1);color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.board,.panel{background:#ffffffee;border:1px solid var(--line);border-radius:24px;box-shadow:0 15px 45px #72507014}.board{padding:15px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day{border:1px solid var(--line);border-radius:18px;background:#fff;min-height:510px;display:flex;flex-direction:column;overflow:hidden;transition:.18s}.day.selected{box-shadow:inset 0 0 0 3px #f7b4d7}.day.dragover{box-shadow:inset 0 0 0 4px #9e7ae5;background:#fbf7ff}.dayhead{text-align:center;padding:11px 4px;background:#fff0f8;cursor:pointer;position:relative}.dayhead b{display:block}.dayhead small{color:#9b8299}.daytools{position:absolute;right:5px;top:5px}.clearDay{border:0;background:#ffffffaa;border-radius:50%;width:22px;height:22px;color:#a982a3;cursor:pointer}.slots{padding:8px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:90px}.token{position:relative;display:flex;align-items:center;justify-content:center;padding:4px;border-radius:13px;background:#fff7fb;border:1px solid #f0d8e7;cursor:grab;min-height:78px;transition:.15s}.token:active{cursor:grabbing}.token.dragging{opacity:.35;transform:scale(.97)}.token.drop-before{box-shadow:0 -4px 0 0 #a778df}.token.drop-after{box-shadow:0 4px 0 0 #a778df}.token .pic{width:100%;height:80px;flex:none}.pic{display:block;object-fit:contain;object-position:center;border-radius:11px;background:#fff;user-select:none;-webkit-user-drag:none}.token.done{background:#eaf9ef;opacity:.82}.check{position:absolute;left:4px;top:4px;border:0;border-radius:50%;width:24px;height:24px;background:#fff;color:#6eaa7b;font-weight:900;box-shadow:0 2px 7px #0001;pointer-events:none}.token button.del{position:absolute;right:3px;top:3px;border:0;background:#ffffffdd;color:#b18aaa;cursor:pointer;border-radius:50%;width:21px;height:21px;font-size:14px;line-height:18px;z-index:2}.moveBtns{display:none}.empty{border:2px dashed #ead9e6;color:#c0a9bc;border-radius:13px;padding:16px 5px;text-align:center;font-size:12px;margin:auto 0}.panel{padding:18px}.panel h2{margin:0 0 5px}.library{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lib{border:1px solid var(--line);background:#fff;border-radius:15px;padding:5px;cursor:grab;text-align:center;transition:.15s}.lib:hover{transform:translateY(-2px);box-shadow:0 7px 16px #72507016}.lib.dragging{opacity:.4}.lib .pic{width:100%;height:88px}.tip{margin:10px 0 12px;padding:10px;border-radius:13px;background:#f8f2ff;color:#795e91;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stat{padding:11px;border-radius:14px;background:#fff6bf;text-align:center;color:#8d6d2c}.stat b{display:block;font-size:22px}.progress{height:10px;border-radius:99px;background:#eee4ee;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f39ac9,#b995ea);border-radius:99px;transition:.3s}.custom{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;margin:6px 0 8px;background:#fff}.actions{display:flex;gap:7px;margin-top:10px}.actions .btn{flex:1}.footer{text-align:center;margin:16px;color:#a28da0;font-size:12px}.mobileDays,.mobileTools{display:none}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#49384d;color:#fff;padding:11px 17px;border-radius:99px;font-weight:800;transition:.25s;z-index:50;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}.conf{position:absolute;width:9px;height:14px;animation:fall 900ms ease-out forwards}@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(85vh) rotate(720deg);opacity:0}}
@media(max-width:950px){body{padding-bottom:env(safe-area-inset-bottom)}.app{padding:12px 10px 28px;max-width:620px}.head{display:block;margin-bottom:10px}.title h1{font-size:28px}.title p{font-size:13px;margin-top:5px}.head>div:last-child{display:flex;gap:8px;margin-top:10px}.head .btn{flex:1;padding:12px 10px;font-size:14px}.layout{display:flex;flex-direction:column;gap:10px}.panel{order:2;padding:12px;border-radius:20px}.board{padding:10px;border-radius:20px;box-shadow:0 8px 28px #72507012}.week{display:block}.week .day{display:none;min-height:0;border-radius:17px}.week .day.selected{display:flex;box-shadow:inset 0 0 0 2px #f7b4d7}.dayhead{padding:13px 48px 13px 12px;min-height:62px}.dayhead b{font-size:19px}.dayhead small{font-size:12px}.daytools{right:8px;top:19px}.clearDay{width:30px;height:30px;font-size:18px}.slots{padding:9px;gap:9px;min-height:210px}.token{min-height:108px;padding:6px;border-radius:16px;cursor:default;box-shadow:0 2px 8px #7250700d}.token .pic{height:104px;width:100%}.token button.del{width:30px;height:30px;right:5px;top:5px;font-size:18px;background:#fff;box-shadow:0 2px 7px #00012}.check{width:32px;height:32px;left:5px;top:5px;font-size:20px;display:flex;align-items:center;justify-content:center}.moveBtns{display:flex;position:absolute;left:6px;bottom:5px;gap:5px;z-index:3}.moveBtns button{border:0;background:#ffffffee;color:#7958a1;width:34px;height:30px;border-radius:10px;font-weight:900;font-size:17px;box-shadow:0 2px 7px #00014}.moveBtns button:disabled{opacity:.25}.empty{padding:24px 12px;font-size:14px;min-height:100px;display:flex;align-items:center;justify-content:center}.mobileDays{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 9px;margin:0 -2px;scrollbar-width:none}.mobileDays::-webkit-scrollbar{display:none}.dayTab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 13px;min-width:55px;text-align:center;color:#8f7c8e;font-weight:800;box-shadow:0 2px 8px #7250700a}.dayTab span{display:block;font-size:16px;color:var(--ink)}.dayTab small{font-size:10px}.dayTab.active{background:linear-gradient(135deg,#f7a9cf,#c99cf1);color:#fff;border-color:transparent}.dayTab.active span{color:#fff}.mobileTools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mobileTools button{border:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;font-weight:800;color:#795e91}.stats{margin-top:10px;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;border-radius:14px;font-size:13px}.stat b{font-size:21px}.progress{height:8px}.panel h2{font-size:20px}.tip{font-size:13px;line-height:1.35;margin:8px 0 10px}.library{grid-template-columns:repeat(3,1fr);gap:9px}.lib{border-radius:16px;padding:4px;min-height:116px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #7250700c}.lib .pic{height:108px;width:100%}.lib:active{transform:scale(.97)}.custom{margin-top:14px}.custom input,.custom select{min-height:44px;font-size:16px}.custom .btn{min-height:46px}.actions{margin-top:8px}.actions .btn{min-height:44px}.footer{margin:12px 0 0}}
@media(min-width:951px){.mobileDays{display:none!important}}
@media print{body{background:#fff}.head,.panel,.footer,.stats,.mobileDays,.mobileTools{display:none!important}.board{box-shadow:none;border:0;padding:0}.week{display:grid!important}.day{display:flex!important;min-height:260mm;border-radius:4px}.token{break-inside:avoid}}
</style>
</head>
<body>
<main class="app"><header class="head"><div class="title"><h1>Мира — моя неделя</h1><p>Выбирай день, добавляй картинки и расставляй их по порядку.</p></div><div><button class="btn" onclick="newWeek()">Новая неделя</button> <button class="btn primary" onclick="window.print()">Печать A4</button></div></header>
<div id="mobileDays" class="mobileDays"></div>
<section class="layout"><div><div class="board"><div id="week" class="week"></div></div><div class="mobileTools"><button onclick="moveSelected(-1)">↑ Поднять</button><button onclick="moveSelected(1)">↓ Опустить</button></div><div class="stats"><div class="stat">Выполнено <b id="doneCount">0</b></div><div class="stat">Прогресс <b id="pct">0%</b><div class="progress"><i id="bar"></i></div></div></div></div>
<aside class="panel"><h2>Картинки Миры</h2><div class="tip">На телефоне просто нажми на картинку — она добавится в выбранный день. Внутри дня используй ↑ ↓ или перетаскивание.</div><div id="library" class="library"></div><div class="custom"><b>Свой жетон</b><input id="customName" placeholder="Название"><select id="customPic"></select><button class="btn primary" style="width:100%" onclick="addCustom()">Добавить</button></div><div class="actions"><button class="btn" onclick="undo()">↩ Отменить</button><button class="btn" onclick="save();toast('Сохранено ✓')">Сохранить</button></div></aside></section><div class="footer">Планер «Мира» · A4</div></main><div id="toast" class="toast"></div><div id="confetti"></div>
<script>
const ROOT='https://raw.githubusercontent.com/TimMir1/timmir1.github.io/main/';const base=[['Проснуться','01_prosnutsya.png'],['Завтрак','02_zavtrak.png'],['Одеться','03_odetsya.png'],['В садик','04_v_sadik.png'],['Бассейн','05_basseyn.png'],['Площадка','06_ploshchadka.png'],['Рисовать','07_risovat.png'],['Читать','08_chitat.png'],['Убрать игрушки','09_ubrat_igrushki.png'],['Ванна','10_vanna.png'],['Чистить зубы','11_chistit_zuby.png'],['Прогулка','12_progulka.png'],['Танцы','13_tantsy.png'],['Мультик','14_multik.png'],['Магазин','15_magazin.png'],['Ужин','16_uzhin.png'],['Сон','17_son.png'],['Я молодец!','18_ya_molodets.png']];const valid=new Set(base.map(x=>x[1])),blank=()=>Array.from({length:7},()=>[]),days=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];let tokens=base.map(x=>[x[0],x[1]]),week=blank(),selected=0,history=[],dragData=null,mobileSelectedIndex=-1;
try{let t=JSON.parse(localStorage.getItem('miraTokens')||'null'),w=JSON.parse(localStorage.getItem('miraWeek')||'null');if(Array.isArray(t)&&t.length)tokens=t.map(x=>typeof x[1]==='number'?[x[0],base[x[1]]?.[1]||base[0][1]]:x).filter(x=>x&&valid.has(x[1]));if(Array.isArray(w)&&w.length===7)week=w.map(d=>(Array.isArray(d)?d:[]).map(x=>{let p=typeof x.p==='number'?base[x.p]?.[1]:x.p;return p&&valid.has(p)?{p,n:x.n||'',done:!!x.done}:null}).filter(Boolean))}catch(e){}
function path(p){return p.startsWith('http')?p:ROOT+p}function snapshot(){return JSON.stringify({week,tokens})}function pushHistory(){history.push(snapshot());if(history.length>20)history.shift()}function save(){localStorage.setItem('miraTokens',JSON.stringify(tokens));localStorage.setItem('miraWeek',JSON.stringify(week))}function undo(){if(!history.length){toast('Пока нечего отменять');return}let s=JSON.parse(history.pop());week=s.week;tokens=s.tokens;save();render();toast('Отменено ↩')}function addToken(p,n,target){pushHistory();week[target].push({p,n,done:false});save();render();if(innerWidth<=950)setTimeout(()=>document.querySelector('.slots .token:last-child')?.scrollIntoView({behavior:'smooth',block:'center'}),60)}function add(i){addToken(tokens[i][1],tokens[i][0],selected)}function toggle(d,j){pushHistory();let was=week[d][j].done;week[d][j].done=!was;mobileSelectedIndex=j;save();render();if(!was)celebrate()}function del(d,j){pushHistory();week[d].splice(j,1);if(mobileSelectedIndex>=week[d].length)mobileSelectedIndex=week[d].length-1;save();render()}function clearDay(d){if(!week[d].length)return;pushHistory();week[d]=[];mobileSelectedIndex=-1;save();render();toast('День очищен')}function newWeek(){if(confirm('Начать новую неделю? Все задания этой недели будут очищены.')){pushHistory();week=blank();mobileSelectedIndex=-1;save();render();toast('Новая неделя ✨')}}function addCustom(){let n=customName.value.trim(),p=customPic.value;if(!n)return;pushHistory();tokens.push([n,p]);customName.value='';save();render();toast('Новая картинка добавлена')}
function moveSelected(dir){let d=selected;if(!week[d].length)return;let j=mobileSelectedIndex;if(j<0)j=week[d].length-1;let to=j+dir;if(to<0||to>=week[d].length)return;pushHistory();[week[d][j],week[d][to]]=[week[d][to],week[d][j]];mobileSelectedIndex=to;save();render();setTimeout(()=>document.querySelectorAll('.token')[to]?.scrollIntoView({behavior:'smooth',block:'center'}),40)}
function dragStart(e,type,d,j){dragData={type,d,j};e.currentTarget.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',JSON.stringify(dragData))}}function dragEnd(e){e.currentTarget.classList.remove('dragging');dragData=null;clearMarks()}function clearMarks(){document.querySelectorAll('.drop-before,.drop-after,.dragover').forEach(x=>x.classList.remove('drop-before','drop-after','dragover'))}function allowDay(e){e.preventDefault();e.currentTarget.classList.add('dragover');if(e.dataTransfer)e.dataTransfer.dropEffect='move'}function leaveDay(e){if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('dragover')}function readDrag(e){try{return JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){return dragData}}function dropDay(e,target){e.preventDefault();clearMarks();let data=readDrag(e);if(!data)return;pushHistory();if(data.type==='lib')week[target].push({p:tokens[data.j][1],n:tokens[data.j][0],done:false});else if(data.type==='token'){let item=week[data.d].splice(data.j,1)[0];week[target].push(item)}save();render();toast('Перемещено ✓')}function overToken(e,d,j){e.preventDefault();e.stopPropagation();if(!dragData)return;clearMarks();let rect=e.currentTarget.getBoundingClientRect();e.currentTarget.classList.add(e.clientY<rect.top+rect.height/2?'drop-before':'drop-after');if(e.dataTransfer)e.dataTransfer.dropEffect='move'}function dropToken(e,targetD,targetJ){e.preventDefault();e.stopPropagation();let data=readDrag(e);clearMarks();if(!data)return;pushHistory();if(data.type==='lib'){week[targetD].splice(targetJ,0,{p:tokens[data.j][1],n:tokens[data.j][0],done:false})}else if(data.type==='token'){if(data.d===targetD){if(data.j===targetJ){history.pop();return}let item=week[targetD].splice(data.j,1)[0],rect=e.currentTarget.getBoundingClientRect(),before=e.clientY<rect.top+rect.height/2,idx=targetJ+(before?0:1);if(data.j<idx)idx--;week[targetD].splice(idx,0,item)}else{let item=week[data.d].splice(data.j,1)[0],rect=e.currentTarget.getBoundingClientRect(),before=e.clientY<rect.top+rect.height/2,idx=targetJ+(before?0:1);week[targetD].splice(idx,0,item)}}save();render();toast('Порядок изменён ✓')}
function renderMobileDays(){let el=document.getElementById('mobileDays');if(innerWidth>950){el.innerHTML='';return}el.innerHTML=days.map((d,i)=>{let total=week[i].length,done=week[i].filter(x=>x.done).length;return `<button class="dayTab ${i===selected?'active':''}" onclick="selected=${i};mobileSelectedIndex=-1;render()"><span>${d}</span><small>${total?done+'/'+total:'пусто'}</small></button>`}).join('')}
function render(){renderMobileDays();document.getElementById('library').innerHTML=tokens.map((t,i)=>`<button class="lib" draggable="true" ondragstart="dragStart(event,'lib',0,${i})" ondragend="dragEnd(event)" onclick="add(${i})"><img class="pic" src="${path(t[1])}?v=15" alt=""></button>`).join('');document.getElementById('customPic').innerHTML=base.map(t=>`<option value="${t[1]}">${t[0]}</option>`).join('');document.getElementById('week').innerHTML=days.map((d,i)=>{let total=week[i].length,done=week[i].filter(x=>x.done).length;return `<div class="day ${i===selected?'selected':''}" ondragover="allowDay(event)" ondragleave="leaveDay(event)" ondrop="dropDay(event,${i})"><div class="dayhead" onclick="selected=${i};mobileSelectedIndex=-1;render()"><b>${d}</b><small>${total?done+' / '+total:'выбрать'}</small><div class="daytools"><button class="clearDay" title="Очистить день" onclick="event.stopPropagation();clearDay(${i})">×</button></div></div><div class="slots">${week[i].map((t,j)=>`<div class="token ${t.done?'done':''}" draggable="true" ondragstart="dragStart(event,'token',${i},${j})" ondragend="dragEnd(event)" ondragover="overToken(event,${i},${j})" ondrop="dropToken(event,${i},${j})" onclick="mobileSelectedIndex=j;toggle(${i},${j})"><img class="pic" src="${path(t.p)}?v=15" alt=""><span class="check">${t.done?'✓':''}</span><button class="del" aria-label="Удалить" onclick="event.stopPropagation();del(${i},${j})">×</button><span class="moveBtns"><button onclick="event.stopPropagation();mobileSelectedIndex=${j};moveSelected(-1)" ${j===0?'disabled':''}>↑</button><button onclick="event.stopPropagation();mobileSelectedIndex=${j};moveSelected(1)" ${j===total-1?'disabled':''}>↓</button></span></div>`).join('')||'<div class="empty">Добавь сюда первую картинку из блока ниже</div>'}</div></div>`}).join('');let all=week.flat(),done=all.filter(x=>x.done).length,p=all.length?Math.round(done/all.length*100):0;document.getElementById('doneCount').textContent=done;document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%')}
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove('show'),1400)}function celebrate(){let box=document.getElementById('confetti');for(let i=0;i<24;i++){let c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'%';c.style.top=(15+Math.random()*25)+'%';c.style.background=['#f39ac9','#b995ea','#ffd85a','#73c8ef','#8ed9a2'][i%5];box.appendChild(c);setTimeout(()=>c.remove(),950)}}render();
</script></body></html>
