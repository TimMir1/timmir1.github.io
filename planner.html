<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7a9cf"><title>Мира — моя неделя</title><style>
:root{--pink:#f39ac9;--purple:#a982df;--ink:#49384d;--muted:#917c90;--line:#ead8e6}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(145deg,#fff9fc,#f3efff)}button{font:inherit}.app{max-width:1450px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand h1{margin:0;font-size:34px}.brand p{margin:6px 0;color:var(--muted)}.topBtns{display:flex;gap:8px}.btn{border:0;border-radius:16px;padding:12px 17px;font-weight:900;background:#fff;color:#7958a1;box-shadow:0 5px 16px #79507012}.primary{background:linear-gradient(135deg,#f6a5cd,#bf99ed);color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}.board,.panel{background:#fffffff0;border:1px solid var(--line);border-radius:24px;box-shadow:0 15px 45px #72507014}.board{padding:15px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day{border:1px solid var(--line);border-radius:18px;background:#fff;min-height:510px;display:flex;flex-direction:column;overflow:hidden}.day.selected{box-shadow:inset 0 0 0 3px var(--pink)}.dayhead{text-align:center;padding:12px;background:#fff0f8}.dayhead b{display:block}.dayhead small{color:var(--muted)}.slots{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}.token{position:relative;display:flex;justify-content:center;padding:4px;min-height:82px;border-radius:14px;background:#fff7fb;border:1px solid #f0d8e7;cursor:grab}.token.dragging{opacity:.35}.token.done{background:#eaf9ef;box-shadow:0 0 0 3px #9bd8b0}.pic{width:100%;height:84px;object-fit:contain;border-radius:10px;background:#fff;user-select:none;-webkit-user-drag:none}.check{position:absolute;left:5px;top:5px;width:27px;height:27px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#55a96d;font-weight:1000}.del{position:absolute;right:4px;top:4px;width:24px;height:24px;border:0;border-radius:50%;background:#fff;color:#b18aaa;font-weight:900}.move{display:none}.empty{margin:auto 0;padding:22px 8px;border:2px dashed #ead9e6;border-radius:15px;color:#bca6ba;text-align:center}.panel{padding:18px}.panel h2{margin:0}.hint{margin:8px 0 12px;padding:11px;border-radius:14px;background:#f7f0ff;color:#765d8c;font-size:13px}.library{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.lib{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px;cursor:pointer}.lib .pic{height:94px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stat{padding:11px;border-radius:15px;background:#fff6bf;text-align:center;color:#8d6d2c}.stat b{display:block;font-size:23px}.progress{height:9px;background:#eee4ee;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f39ac9,#b995ea);border-radius:99px}.custom{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;margin:6px 0 8px}.actions{display:flex;gap:8px}.actions .btn{flex:1}.mobileOnly{display:none}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#49384d;color:#fff;padding:12px 18px;border-radius:99px;font-weight:900;z-index:100;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}#confetti{position:fixed;inset:0;pointer-events:none;z-index:110}.conf{position:absolute;width:9px;height:14px;animation:fall .9s forwards}@keyframes fall{to{transform:translateY(90vh) rotate(720deg);opacity:0}}
.present{position:fixed;inset:0;background:linear-gradient(145deg,#fff8fc,#eee5ff);z-index:200;padding:16px;overflow:auto}.presentCard{max-width:700px;margin:auto;text-align:center}.present h2{font-size:34px;margin:8px 0}.presentDate{color:var(--muted);font-weight:800}.presentList{display:grid;gap:12px;margin:18px 0}.presentItem{background:#fff;border-radius:22px;padding:8px;position:relative;box-shadow:0 5px 18px #72507014}.presentItem.done{box-shadow:0 0 0 4px #9bd8b0}.presentItem img{height:145px;max-width:100%;object-fit:contain}.bigCheck{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;background:#e8f8ed;color:#54a56c;font-size:27px;font-weight:1000;display:flex;align-items:center;justify-content:center}
@media(max-width:950px){.app{padding:10px 10px 30px;max-width:620px}.top{display:block}.brand{text-align:center}.brand h1{font-size:29px}.brand p{font-size:13px;margin:5px}.topBtns{margin-top:8px}.topBtns .btn{flex:1;padding:12px 7px;font-size:14px}.mobileOnly{display:block}.dayPicker{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 9px;scrollbar-width:none}.dayPicker::-webkit-scrollbar{display:none}.dayBtn{flex:1 0 46px;min-width:46px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:8px 5px;color:#8d788b;font-weight:900}.dayBtn b{display:block;font-size:17px;color:var(--ink)}.dayBtn small{font-size:10px}.dayBtn.active{background:linear-gradient(135deg,#f7a5cd,#bf99ed);color:#fff;border-color:transparent}.dayBtn.active b{color:#fff}.childHelp{margin:2px 0 9px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 3px;text-align:center;font-size:11px;font-weight:900;color:#795e91}.step strong{display:block;font-size:20px;color:#f08cbd}.todayTitle{text-align:center;font-size:24px;font-weight:1000;margin:3px 0 8px}.layout{display:flex;flex-direction:column;gap:10px}.board{padding:9px;border-radius:20px}.week{display:block}.week .day{display:none;min-height:0;border-radius:18px}.week .day.selected{display:flex;box-shadow:inset 0 0 0 3px var(--pink)}.dayhead{display:none}.slots{padding:9px;gap:11px;min-height:230px}.token{min-height:135px;padding:6px;border-radius:18px;cursor:default;box-shadow:0 2px 8px #7250700d}.token .pic{height:130px}.check{width:38px;height:38px;left:7px;top:7px;font-size:23px}.del{width:34px;height:34px;right:7px;top:7px;font-size:18px;box-shadow:0 2px 7px #0001}.move{display:flex;position:absolute;left:7px;bottom:7px;gap:6px}.move button{width:42px;height:35px;border:0;border-radius:11px;background:#fff;color:#7657a0;font-weight:1000;font-size:20px;box-shadow:0 2px 8px #0001}.move button:disabled{opacity:.25}.empty{min-height:120px;font-size:16px;padding:25px;display:flex;align-items:center;justify-content:center}.mobileActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.mobileActions .btn{padding:13px 7px}.stats{margin-top:9px}.stat{padding:9px;font-size:13px}.panel{order:2;padding:12px;border-radius:20px}.panel h2{text-align:center;font-size:21px}.hint{text-align:center;font-size:13px;line-height:1.3}.library{grid-template-columns:repeat(3,1fr);gap:9px}.lib{min-height:126px;border-radius:17px}.lib .pic{height:118px}.custom,.actions{display:none}.footer{font-size:11px;text-align:center}.panel:before{content:'Выбери картинку — она появится в плане';display:block;text-align:center;font-weight:1000;color:#795e91;margin-bottom:8px}.present h2{font-size:30px}}
@media(min-width:951px){.dayPicker,.childHelp,.mobileActions,.todayTitle{display:none!important}}@media print{body{background:#fff}.top,.panel,.stats,.dayPicker,.childHelp,.mobileActions,.footer{display:none!important}.layout{display:block}.board{box-shadow:none;border:0;padding:0}.week{display:grid!important}.day{display:flex!important;min-height:260mm;border-radius:4px}.token{break-inside:avoid}.present{display:none}}
</style></head><body><main class="app"><header class="top"><div class="brand"><h1>Мира — моя неделя</h1><p>Маленькие шаги → большие победы</p></div><div class="topBtns"><button class="btn" onclick="newWeek()">Новая неделя</button><button class="btn primary" onclick="window.print()">Печать A4</button></div></header><div class="mobileOnly"><div id="dayPicker" class="dayPicker"></div><div class="childHelp"><div class="steps"><div class="step"><strong>1</strong>Выбери день</div><div class="step"><strong>2</strong>Нажми картинку</div><div class="step"><strong>3</strong>Нажми на план</div></div></div><div id="todayTitle" class="todayTitle"></div></div><section class="layout"><div><div class="board"><div id="week" class="week"></div></div><div class="mobileOnly mobileActions"><button class="btn" onclick="moveSelected(-1)">↑ Выше</button><button class="btn" onclick="moveSelected(1)">↓ Ниже</button></div><div class="stats"><div class="stat">Готово <b id="doneCount">0</b></div><div class="stat">Неделя <b id="pct">0%</b><div class="progress"><i id="bar"></i></div></div></div></div><aside class="panel"><h2>Картинки Миры</h2><div class="hint">Нажми на картинку — она добавится в выбранный день.</div><div id="library" class="library"></div><div class="custom"><b>Свой жетон</b><input id="customName" placeholder="Название"><select id="customPic"></select><button class="btn primary" style="width:100%" onclick="addCustom()">Добавить</button></div><div class="actions"><button class="btn" onclick="undo()">↩ Отменить</button><button class="btn" onclick="save();toast('Сохранено ✓')">Сохранить</button></div></aside></section><div class="mobileOnly mobileActions"><button class="btn" onclick="undo()">↩ Отменить</button><button class="btn primary" onclick="showPapa()">Папа, смотри!</button></div><div class="footer">Планер «Мира» · A4</div></main><div id="toast" class="toast"></div><div id="confetti"></div><div id="present" class="present" style="display:none"><div class="presentCard"><div style="font-size:48px">★</div><h2>Папа, вот мои планы!</h2><div id="presentDate" class="presentDate"></div><div id="presentList" class="presentList"></div><button class="btn primary" onclick="hidePapa()">Вернуться</button></div></div><script>
const ROOT='https://raw.githubusercontent.com/TimMir1/timmir1.github.io/main/';const base=[['Проснуться','01_prosnutsya.png'],['Завтрак','02_zavtrak.png'],['Одеться','03_odetsya.png'],['В садик','04_v_sadik.png'],['Бассейн','05_basseyn.png'],['Площадка','06_ploshchadka.png'],['Рисовать','07_risovat.png'],['Читать','08_chitat.png'],['Убрать игрушки','09_ubrat_igrushki.png'],['Ванна','10_vanna.png'],['Чистить зубы','11_chistit_zuby.png'],['Прогулка','12_progulka.png'],['Танцы','13_tantsy.png'],['Мультик','14_multik.png'],['Магазин','15_magazin.png'],['Ужин','16_uzhin.png'],['Сон','17_son.png'],['Я молодец!','18_ya_molodets.png']];const days=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];const full=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];const valid=new Set(base.map(x=>x[1])),blank=()=>Array.from({length:7},()=>[]);let tokens=base.map(x=>[x[0],x[1]]),week=blank(),selected=new Date().getDay()===0?6:new Date().getDay()-1,history=[],selectedToken=-1,dragData=null;try{let t=JSON.parse(localStorage.getItem('miraTokens')||'null'),w=JSON.parse(localStorage.getItem('miraWeek')||'null');if(Array.isArray(t)&&t.length)tokens=t.filter(x=>x&&valid.has(x[1]));if(Array.isArray(w)&&w.length===7)week=w.map(d=>(Array.isArray(d)?d:[]).map(x=>{let p=typeof x.p==='number'?base[x.p]?.[1]:x.p;return p&&valid.has(p)?{p,done:!!x.done}:null}).filter(Boolean))}catch(e){}
function path(p){return p.startsWith('http')?p:ROOT+p}function save(){localStorage.setItem('miraTokens',JSON.stringify(tokens));localStorage.setItem('miraWeek',JSON.stringify(week))}function snap(){return JSON.stringify({week,tokens})}function hist(){history.push(snap());if(history.length>30)history.shift()}function undo(){if(!history.length){toast('Пока нечего отменять');return}let s=JSON.parse(history.pop());week=s.week;tokens=s.tokens;selectedToken=-1;save();render();toast('Готово')}
function add(i){hist();week[selected].push({p:tokens[i][1],done:false});selectedToken=week[selected].length-1;save();render();if(innerWidth<=950)setTimeout(()=>document.querySelector('.token:last-child')?.scrollIntoView({behavior:'smooth',block:'center'}),60)}function toggle(d,j){hist();week[d][j].done=!week[d][j].done;selectedToken=j;save();render();if(week[d][j].done)celebrate()}function del(d,j){hist();week[d].splice(j,1);selectedToken=-1;save();render();toast('Убрали из плана')}function moveSelected(dir){if(selectedToken<0||selectedToken>=week[selected].length){toast('Сначала выбери картинку');return}let n=selectedToken+dir;if(n<0||n>=week[selected].length)return;hist();let a=week[selected];[a[selectedToken],a[n]]=[a[n],a[selectedToken]];selectedToken=n;save();render()}function newWeek(){if(confirm('Начать новую неделю?')){hist();week=blank();selectedToken=-1;save();render();toast('Новая неделя')}}function addCustom(){let n=customName.value.trim(),p=customPic.value;if(!n)return;hist();tokens.push([n,p]);customName.value='';save();render();toast('Добавили')}
function dragStart(e,type,d,j){dragData={type,d,j};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',JSON.stringify(dragData));e.currentTarget.classList.add('dragging')}function dragEnd(e){e.currentTarget.classList.remove('dragging')}function dropDay(e,target){e.preventDefault();let x;try{x=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){x=dragData}if(!x)return;hist();if(x.type==='lib')week[target].push({p:tokens[x.j][1],done:false});else if(x.type==='token')week[target].push(week[x.d].splice(x.j,1)[0]);selected=target;selectedToken=week[target].length-1;save();render();toast('Переместили')}
function render(){library.innerHTML=tokens.map((t,i)=>`<button class="lib" onclick="add(${i})" draggable="true" ondragstart="dragStart(event,'lib',0,${i})" ondragend="dragEnd(event)"><img class="pic" src="${path(t[1])}?v=21"></button>`).join('');customPic.innerHTML=base.map(t=>`<option value="${t[1]}">${t[0]}</option>`).join('');dayPicker.innerHTML=days.map((d,i)=>`<button class="dayBtn ${i===selected?'active':''}" onclick="selected=${i};selectedToken=-1;render()"><b>${d}</b><small>${week[i].filter(x=>x.done).length}/${week[i].length}</small></button>`).join('');todayTitle.textContent=full[selected];weekEl=document.getElementById('week');weekEl.innerHTML=days.map((d,i)=>`<div class="day ${i===selected?'selected':''}" ondragover="event.preventDefault()" ondrop="dropDay(event,${i})"><div class="dayhead"><b>${d}</b><small>${week[i].length?'план':'выбрать'}</small></div><div class="slots">${week[i].map((t,j)=>`<div class="token ${t.done?'done':''}" draggable="true" ondragstart="dragStart(event,'token',${i},${j})" ondragend="dragEnd(event)" onclick="toggle(${i},${j})"><img class="pic" src="${path(t.p)}?v=21"><span class="check">${t.done?'✓':''}</span><button class="del" onclick="event.stopPropagation();del(${i},${j})">×</button><div class="move"><button onclick="event.stopPropagation();selected=${i};selectedToken=${j};moveSelected(-1)">↑</button><button onclick="event.stopPropagation();selected=${i};selectedToken=${j};moveSelected(1)">↓</button></div></div>`).join('')||'<div class="empty">Нажми на картинку ниже<br>и она появится здесь</div>'}</div></div>`).join('');let all=week.flat(),done=all.filter(x=>x.done).length,p=all.length?Math.round(done/all.length*100):0;doneCount.textContent=done;pct.textContent=p+'%';bar.style.width=p+'%'}function showPapa(){presentDate.textContent=full[selected]+' · '+new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});presentList.innerHTML=week[selected].length?week[selected].map(t=>`<div class="presentItem ${t.done?'done':''}"><img src="${path(t.p)}?v=21">${t.done?'<div class="bigCheck">✓</div>':''}</div>`).join(''):'<div class="presentItem"><div style="padding:35px;font-size:22px;font-weight:900">Пока план пустой</div></div>';present.style.display='block'}function hidePapa(){present.style.display='none'}function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove('show'),1400)}function celebrate(){let box=document.getElementById('confetti');for(let i=0;i<25;i++){let c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'%';c.style.top=(10+Math.random()*30)+'%';c.style.background=['#f39ac9','#b995ea','#ffd85a','#73c8ef','#8ed9a2'][i%5];box.appendChild(c);setTimeout(()=>c.remove(),950)}}render();
</script></body></html>
