<!doctype html>
<html lang="uz-Cyrl" data-theme="royal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070704">
<meta name="description" content="Чўтки — зикр, салавот ва вирдлар учун рақамли тасбеҳ.">
<title>Чўтки — Ўзбекча</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070704;--surface:rgba(18,18,12,.8);--surface2:rgba(27,27,17,.94);--line:rgba(232,196,83,.22);--gold:#e5bb45;--gold2:#ffe7a0;--green:#0d5a40;--green2:#31b889;--text:#fffdf8;--muted:#b9ad91;--faint:#756c58;--danger:#d9554c;--shadow:0 28px 70px rgba(0,0,0,.5);--sans:Manrope,system-ui,sans-serif;--display:Cinzel,Georgia,serif}
html[data-theme=light]{--bg:#f4f0e8;--surface:rgba(255,255,255,.8);--surface2:#f9f5ed;--line:rgba(120,91,35,.2);--gold:#9c6c16;--gold2:#704b0b;--green:#216b56;--green2:#278c70;--text:#17130c;--muted:#665d4e;--faint:#948875;--shadow:0 22px 55px rgba(79,62,28,.13)}
html[data-theme=dark]{--bg:#0b0907;--surface:rgba(28,21,14,.82);--surface2:#271d13;--line:rgba(206,166,79,.2);--gold:#d5a943;--gold2:#f6d88c;--green:#155240;--green2:#2e9d7d;--text:#fffaf1;--muted:#bdaf9d;--faint:#817462}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}body{background-image:radial-gradient(circle at 50% -15%,rgba(229,187,69,.13),transparent 42%),radial-gradient(circle at 50% 115%,rgba(20,116,80,.12),transparent 38%);overflow-x:hidden}button,input{font:inherit}.app{width:min(720px,100%);margin:auto;padding:18px 14px 32px;min-height:100vh}.glass{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;margin-bottom:3px}.brand h1{margin:0;font-family:var(--display);font-size:clamp(25px,7vw,37px)}.brand h1 span{font-family:var(--sans);font-size:.65em;color:var(--gold2)}.actions{display:flex;gap:7px}.icon{width:43px;height:43px;border:1px solid var(--line);border-radius:50%;background:var(--surface2);color:var(--text);cursor:pointer;font-size:17px}
.tabs{display:flex;gap:4px;padding:5px;border-radius:999px;margin-bottom:12px}.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 5px;border-radius:999px;font-weight:800;font-size:11px;cursor:pointer}.tabs button.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#161108}.chips{display:flex;gap:8px;overflow:auto;padding:2px 2px 11px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:15px;padding:9px 13px;cursor:pointer;min-width:118px}.chip.active{border-color:var(--gold);color:var(--text);background:rgba(229,187,69,.09)}.chip .name{display:block;font-size:12px;font-weight:800;white-space:nowrap}
.card{border-radius:25px;padding:22px 13px 17px;text-align:center;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 4%,rgba(229,187,69,.08),transparent 45%);pointer-events:none}.badge{display:inline-flex;padding:6px 11px;border:1px solid var(--line);border-radius:999px;color:var(--gold2);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.maintext{font-size:clamp(22px,6vw,34px);font-weight:800;line-height:1.45;color:var(--gold2);margin:16px auto 7px;max-width:650px}.translation{font-size:13px;color:var(--muted);line-height:1.55;margin:0 auto;max-width:610px}.target{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;margin:17px 0 2px}.target label{font-size:10px;color:var(--faint);font-weight:800;text-transform:uppercase}.target button{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:800;cursor:pointer}.target button.active{background:var(--green);border-color:var(--green2);color:#effff9}.custom{display:none;gap:5px}.custom.show{display:flex}.custom input{width:78px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:999px;padding:7px;text-align:center;outline:0}
.counter-wrap{margin:15px auto 7px;position:relative;width:min(390px,87vw);aspect-ratio:1}.orbit{position:absolute;inset:3.5%;border-radius:50%;background:conic-gradient(from -90deg,var(--green2) 0deg,var(--gold) var(--pct,0deg),rgba(229,187,69,.1) var(--pct,0deg),rgba(229,187,69,.1) 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));z-index:0}.ring{position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(229,187,69,.15);box-shadow:inset 0 0 70px rgba(229,187,69,.025),0 0 80px rgba(0,0,0,.2);z-index:1}.bead{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px;border-radius:50%;background:#1b1911;border:1px solid rgba(229,187,69,.27);box-shadow:0 3px 7px #000}.bead.filled{background:radial-gradient(circle at 35% 30%,#fff0af,var(--gold) 42%,#79540c);border-color:#ffe9a0;box-shadow:0 0 12px rgba(229,187,69,.48)}.center{position:absolute;inset:22%;border-radius:50%;display:grid;place-items:center;cursor:pointer;user-select:none;touch-action:manipulation;z-index:3}.count{font-size:clamp(62px,18vw,94px);line-height:1;font-weight:800;letter-spacing:-.06em}.round{font-size:11px;color:var(--muted);margin-top:5px}.tap{font-size:10px;color:var(--faint);margin-top:8px;text-transform:uppercase;letter-spacing:.13em}.percent{position:absolute;top:4.5%;left:50%;transform:translateX(-50%);z-index:4;font-size:9px;font-weight:800;color:var(--muted);pointer-events:none}.center.pulse .count{animation:pulse .2s ease}@keyframes pulse{50%{transform:scale(1.08);color:var(--gold2)}}
.progress{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:7px 4px 15px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green2),var(--gold));border-radius:inherit;transition:width .2s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:10px 5px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025)}.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:var(--faint);text-transform:uppercase}.controls{display:flex;gap:8px;margin-top:12px}.control{flex:1;padding:11px 7px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);color:var(--text);font-weight:800;font-size:11px;cursor:pointer}.control.primary{background:var(--green);border-color:var(--green2)}
.panel{margin-top:13px;border-radius:18px;padding:15px}.panel h2{font-size:14px;margin:0 0 10px}.history{display:grid;gap:7px}.day{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:8px;font-size:10px}.bar{height:7px;background:rgba(255,255,255,.06);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}.empty{color:var(--faint);font-size:12px;text-align:center;padding:7px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#17150e;color:#fff7df;border:1px solid var(--line);padding:10px 15px;border-radius:999px;font-size:12px;font-weight:700;z-index:80;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:480px){.app{padding:14px 10px 25px}.tabs button{font-size:10px;padding:10px 3px}.counter-wrap{width:90vw}.card{padding:19px 8px 14px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><small>РАҚАМЛИ ТАСБЕҲ</small><h1>Чўтки <span>ЗИКР</span></h1></div><div class="actions"><button class="icon" id="theme" aria-label="Мавзу">☼</button></div></header>
<nav class="tabs glass"><button class="active" data-cat="zikr">Зикр</button><button data-cat="salawat">Салавот</button><button data-cat="asma">Исмлар</button><button data-cat="wird">Вирдлар</button><button data-cat="custom">Менинг</button></nav>
<div class="chips" id="chips"></div>
<section class="card glass">
<div class="badge" id="badge">Зикр</div><div class="maintext" id="maintext"></div><p class="translation" id="translation"></p>
<div class="target"><label>мақсад</label><button data-target="33">33</button><button data-target="99">99</button><button data-target="100">100</button><button data-target="custom">ўзим</button><span class="custom" id="custom"><input id="customInput" type="number" min="1" max="99999" placeholder="сон"><button id="customApply">ОК</button></span></div>
<div class="counter-wrap"><div class="orbit" id="orbit"></div><div class="ring" id="ring"></div><div class="percent" id="percent">0%</div><div class="center" id="tap" role="button" tabindex="0" aria-label="Санаш"><div><div class="count" id="count">0</div><div class="round" id="round">1 айланиш</div><div class="tap">босинг</div></div></div></div>
<div class="progress"><i id="progress"></i></div>
<div class="stats"><div class="stat"><b id="today">0</b><span>бугун</span></div><div class="stat"><b id="streak">0</b><span>кетма-кет кун</span></div><div class="stat"><b id="total">0</b><span>жами</span></div></div>
<div class="controls"><button class="control primary" id="voice">🎙 Овоз</button><button class="control" id="sound">🔊 Овоз</button><button class="control" id="reset">↺ Тозалаш</button></div>
</section>
<section class="panel glass"><h2>Тарих</h2><div class="history" id="history"></div></section>
</main><div class="toast" id="toast"></div>
<script>
'use strict';
const DATA={
 zikr:[
  {id:'subhanallah',name:'Субҳаналлоҳ',tr:'Аллоҳ покдир',target:33},
  {id:'alhamdulillah',name:'Алҳамдулиллаҳ',tr:'Аллоҳга ҳамд бўлсин',target:33},
  {id:'allahuakbar',name:'Аллоҳу акбар',tr:'Аллоҳ буюкдир',target:33},
  {id:'astaghfirullah',name:'Астағфируллоҳ',tr:'Аллоҳдан мағфират сўрайман',target:100}
 ],
 salawat:[{id:'salawat',name:'Салавоти Иброҳимия',tr:'Эй Аллоҳ, Муҳаммадга ва Муҳаммад аҳлига саловот айт. Иброҳим аҳлига саловот айтганинг каби. Албатта, Сен мақталган ва улуғворсан. Эй Аллоҳ, Муҳаммадга ва Муҳаммад аҳлига барака бер. Иброҳим аҳлига барака берганинг каби. Албатта, Сен мақталган ва улуғворсан.',target:33}],
 asma:[{id:'allah',name:'Аллоҳ',tr:'Аллоҳ',target:99},{id:'arrahman',name:'Ар Раҳмон',tr:'Меҳрибон',target:99},{id:'arraheem',name:'Ар Раҳим',tr:'Раҳмли',target:99}],
 wird:[{id:'afterprayer',name:'Намоздан кейин',tr:'Субҳаналлоҳ 33 марта · Алҳамдулиллаҳ 33 марта · Аллоҳу акбар 34 марта',target:100}],custom:[]
};
const KEY='chetki3-state-v1';
let state=load(),recognition=null,listening=false;
function fresh(){return{cat:'zikr',active:'subhanallah',counts:{},daily:{},targets:{},sound:true,theme:'royal',custom:[]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function $(s){return document.querySelector(s)}
function list(){return state.cat==='custom'?state.custom:DATA[state.cat]||[]}
function item(){return list().find(x=>x.id===state.active)||list()[0]}
function target(){return state.targets[state.active]||item()?.target||33}
function count(){return state.counts[state.active]||0}
function dateKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1700)}
function render(){
 document.documentElement.dataset.theme=state.theme;
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.cat===state.cat));
 const ls=list();$('#chips').innerHTML=ls.map(x=>`<button class="chip ${x.id===state.active?'active':''}" data-id="${x.id}"><span class="name">${x.name}</span></button>`).join('');
 document.querySelectorAll('.chip[data-id]').forEach(b=>b.onclick=()=>{state.active=b.dataset.id;save();render()});
 const x=item();if(!x)return;$('#badge').textContent=state.cat==='zikr'?'Зикр':state.cat==='salawat'?'Салавот':state.cat==='asma'?'Исмлар':state.cat==='wird'?'Вирдлар':'Менинг';$('#maintext').textContent=x.name;$('#translation').textContent=x.tr;$('#count').textContent=count();$('#round').textContent=(Math.floor(count()/33)+1)+' айланиш';
 const p=Math.min(1,count()/Math.max(1,target()));$('#progress').style.width=(p*100)+'%';$('#percent').textContent=Math.round(p*100)+'%';$('#orbit').style.setProperty('--pct',(p*360)+'deg');
 document.querySelectorAll('.target button[data-target]').forEach(b=>b.classList.toggle('active',String(target())===b.dataset.target));
 const ring=$('#ring');ring.innerHTML='';const filled=count()%33;for(let i=0;i<33;i++){const b=document.createElement('i');b.className='bead'+(i<filled?' filled':'');const a=2*Math.PI*i/33-Math.PI/2,r=44;b.style.transform=`translate(calc(-50% + ${Math.cos(a)*r}%),calc(-50% + ${Math.sin(a)*r}%))`;ring.appendChild(b)}
 $('#today').textContent=state.daily[dateKey()]||0;$('#total').textContent=Object.values(state.counts).reduce((a,b)=>a+b,0);$('#streak').textContent=streak();renderHistory();
}
function streak(){let n=0,d=new Date();for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if((state.daily[k]||0)>0){n++;d.setDate(d.getDate()-1)}else break}return n}
function renderHistory(){const h=$('#history'),now=new Date();let a=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');a.push({k,v:state.daily[k]||0})}const mx=Math.max(1,...a.map(x=>x.v));h.innerHTML=a.map(x=>`<div class="day"><span>${x.k}</span><div class="bar"><i style="width:${Math.min(100,x.v/mx*100)}%"></i></div><b>${x.v}</b></div>`).join('')}
function tap(){const id=state.active;state.counts[id]=(state.counts[id]||0)+1;const k=dateKey();state.daily[k]=(state.daily[k]||0)+1;save();const el=$('#tap');el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');render();if(state.sound)beep();if(count()===target())toast('Мақсад бажарилди!')}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=720;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.08);o.stop(c.currentTime+.09)}catch(e){}}
function toggleVoice(){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){toast('Бу браузерда овозли режим йўқ');return}if(listening){recognition?.stop();listening=false;$('#voice').textContent='🎙 Овоз';return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new R();recognition.lang='uz-UZ';recognition.continuous=true;recognition.interimResults=false;recognition.maxAlternatives=3;recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){const s=e.results[i][0].transcript.toLowerCase();if(/суб|аллоҳ|ҳамд|истиғ|астағ|салав/.test(s))tap()}}};recognition.onend=()=>{if(listening)setTimeout(()=>{try{recognition.start()}catch(e){}},250)};recognition.onerror=()=>{};listening=true;recognition.start();$('#voice').textContent='⏹ Тўхтатиш';toast('Овозли режим ёқилди')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;const l=list();state.active=l[0]?.id||'';save();render()});
document.querySelectorAll('.target button').forEach(b=>b.onclick=()=>{if(b.dataset.target==='custom'){$('#custom').classList.add('show');return}state.targets[state.active]=Number(b.dataset.target);save();render()});
$('#customApply').onclick=()=>{const v=Number($('#customInput').value);if(v>0){state.targets[state.active]=v;save();render();$('#custom').classList.remove('show')}};
$('#tap').onclick=tap;$('#tap').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}};
$('#reset').onclick=()=>{if(confirm('Счётчикни тозлашни истайсизми?')){state.counts[state.active]=0;save();render()}};
$('#sound').onclick=()=>{state.sound=!state.sound;save();$('#sound').textContent=state.sound?'🔊 Овоз':'🔇 Овоз';toast(state.sound?'Овоз ёқилди':'Овоз ўчирилди')};
$('#theme').onclick=()=>{state.theme=state.theme==='royal'?'light':state.theme==='light'?'dark':'royal';save();render()};$('#voice').onclick=toggleVoice;
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();tap()}if(e.key==='r'||e.key==='R'){$('#reset').click()}});
render();
</script>
</body>
</html>
