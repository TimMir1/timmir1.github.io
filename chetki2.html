<!doctype html>
<html lang="ru" data-theme="royal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070704">
<meta name="description" content="Чётки — цифровой тасбих для зикра, салавата и вирдов.">
<title>Чётки — Royal 2.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070704;--bg2:#0e100b;--surface:rgba(18,18,12,.78);--surface2:rgba(27,27,17,.92);--line:rgba(232,196,83,.22);--gold:#e5bb45;--gold2:#ffe7a0;--green:#0d5a40;--green2:#31b889;--text:#fffdf8;--muted:#b9ad91;--faint:#756c58;--danger:#d9554c;--shadow:0 28px 70px rgba(0,0,0,.5);--r:26px;--r2:18px;--sans:Manrope,system-ui,sans-serif;--display:Cinzel,Georgia,serif;--ar:Amiri,"Traditional Arabic",serif}
html[data-theme=light]{--bg:#f4f0e8;--bg2:#e8eee9;--surface:rgba(255,255,255,.78);--surface2:rgba(249,245,237,.96);--line:rgba(120,91,35,.2);--gold:#9c6c16;--gold2:#704b0b;--green:#216b56;--green2:#278c70;--text:#17130c;--muted:#665d4e;--faint:#948875;--shadow:0 22px 55px rgba(79,62,28,.13)}
html[data-theme=dark]{--bg:#0b0907;--bg2:#15110c;--surface:rgba(28,21,14,.8);--surface2:rgba(39,29,19,.94);--line:rgba(206,166,79,.2);--gold:#d5a943;--gold2:#f6d88c;--green:#155240;--green2:#2e9d7d;--text:#fffaf1;--muted:#bdaF9d;--faint:#817462}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}body{background-image:radial-gradient(circle at 50% -15%,rgba(229,187,69,.13),transparent 42%),radial-gradient(circle at 50% 115%,rgba(20,116,80,.12),transparent 38%);overflow-x:hidden}button,input{font:inherit}.app{width:min(720px,100%);margin:auto;padding:22px 18px 34px;min-height:100vh}.glass{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand small{display:block;color:var(--gold);font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;margin-bottom:4px}.brand h1{margin:0;font-family:var(--display);font-size:clamp(25px,7vw,38px);letter-spacing:.03em}.brand h1 span{font-family:var(--ar);font-weight:400;color:var(--gold2);font-size:1.1em}.actions{display:flex;gap:8px}.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--surface2);color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:18px;transition:.2s}.icon:hover{border-color:var(--gold);transform:translateY(-2px)}.icon:active{transform:scale(.94)}
.tabs{display:flex;gap:5px;padding:5px;border-radius:999px;margin-bottom:13px}.tabs button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);padding:11px 8px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer}.tabs button.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#161108;box-shadow:0 8px 22px rgba(229,187,69,.18)}
.chips{display:flex;gap:9px;overflow:auto;padding:2px 2px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:16px;padding:10px 14px;text-align:left;cursor:pointer;min-width:112px}.chip.active{border-color:var(--gold);background:rgba(229,187,69,.09);color:var(--text);box-shadow:inset 0 0 0 1px rgba(229,187,69,.16)}.chip .ar{display:block;font:18px var(--ar);color:var(--gold2);direction:rtl}.chip .name{display:block;font-size:12px;font-weight:800;margin-top:2px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.card{border-radius:var(--r);padding:25px 18px 20px;text-align:center;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 5%,rgba(229,187,69,.08),transparent 45%);pointer-events:none}.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;color:var(--gold2);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.arbig{font:clamp(34px,9vw,52px)/1.55 var(--ar);direction:rtl;color:var(--gold2);margin:16px auto 6px;white-space:pre-line;max-width:650px}.arbig.long{font-size:clamp(24px,5.8vw,36px);line-height:1.8;margin-top:12px}.translit{font-size:16px;font-weight:800;margin:0}.translation{font-size:13px;color:var(--muted);line-height:1.55;margin:7px auto 0;max-width:620px}.target{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;margin:18px 0 3px}.target button{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:800;cursor:pointer}.target button.active{background:var(--green);border-color:var(--green2);color:#effff9}.custom{display:none}.custom.show{display:flex}.custom input{width:76px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:999px;padding:7px 10px;text-align:center;outline:none}.custom button{padding:7px 11px}
.counter-wrap{margin:16px auto 8px;position:relative;width:min(390px,82vw);aspect-ratio:1}.orbit{position:absolute;inset:3.5%;border-radius:50%;background:conic-gradient(from -90deg,var(--green2) 0deg,var(--gold) var(--pct,0deg),rgba(229,187,69,.10) var(--pct,0deg),rgba(229,187,69,.10) 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));filter:drop-shadow(0 0 7px rgba(49,184,137,.14));z-index:0}.orbit:after{content:"";position:absolute;inset:-1px;border-radius:50%;background:conic-gradient(from -90deg,transparent 0deg,rgba(255,231,160,.65) var(--pct,0deg),transparent calc(var(--pct,0deg) + .5deg));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px))}.ring{position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(229,187,69,.15);box-shadow:inset 0 0 70px rgba(229,187,69,.025),0 0 80px rgba(0,0,0,.2);z-index:1}.bead{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#1b1911;border:1px solid rgba(229,187,69,.27);box-shadow:0 3px 7px #000;transition:.22s}.bead.filled{background:radial-gradient(circle at 35% 30%,#fff0af,var(--gold) 42%,#79540c);border-color:#ffe9a0;box-shadow:0 0 12px rgba(229,187,69,.48)}.center{position:absolute;inset:22%;border-radius:50%;display:grid;place-items:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;z-index:3}.center:focus-visible{outline:2px solid var(--gold);outline-offset:6px}.count{font-size:clamp(60px,17vw,92px);line-height:1;font-weight:800;letter-spacing:-.06em}.round{font-size:11px;color:var(--muted);margin-top:5px}.tap{font-size:10px;color:var(--faint);margin-top:8px;text-transform:uppercase;letter-spacing:.13em}.percent{position:absolute;top:4.5%;left:50%;transform:translateX(-50%);z-index:4;font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--muted);pointer-events:none}.center.pulse .count{animation:pulse .22s ease}.ring.complete{animation:complete .65s ease}@keyframes pulse{50%{transform:scale(1.09);color:var(--gold2)}}@keyframes complete{40%{box-shadow:0 0 0 12px rgba(229,187,69,.06),inset 0 0 90px rgba(229,187,69,.1)}100%{box-shadow:inset 0 0 70px rgba(229,187,69,.025),0 0 80px rgba(0,0,0,.2)}}
.progress{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:8px 4px 16px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green2),var(--gold));border-radius:inherit;transition:width .25s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:11px 7px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.025)}.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}.controls{display:flex;gap:9px;margin-top:13px}.control{flex:1;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--text);font-weight:800;font-size:12px;cursor:pointer}.control.primary{background:var(--green);border-color:var(--green2)}.control.danger{color:#ffaaa4}.focusbar{display:none;gap:8px;margin-top:10px}.focusbar.show{display:flex}
.panel{margin-top:14px;border-radius:var(--r2);padding:17px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.panel h2{font-size:14px;margin:0}.panel small{color:var(--faint)}.history{display:grid;gap:7px}.day{display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:10px;font-size:11px}.day .bar{height:7px;background:rgba(255,255,255,.06);border-radius:9px;overflow:hidden}.day .bar i{display:block;height:100%;background:var(--gold);border-radius:9px}.empty{color:var(--faint);font-size:12px;text-align:center;padding:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;padding:18px;z-index:50}.modal.show{display:grid}.dialog{width:min(430px,100%);border-radius:24px;padding:20px}.dialog h2{margin:0 0 8px}.dialog p{color:var(--muted);font-size:13px;line-height:1.5}.dialog input{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);color:var(--text);outline:none;margin:7px 0}.dialog .row{display:flex;gap:8px}.dialog button{flex:1;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);color:var(--text);font-weight:800;cursor:pointer}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#17150e;color:#fff7df;border:1px solid var(--line);padding:10px 15px;border-radius:999px;font-size:12px;font-weight:700;z-index:80;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
.focus-mode .app{max-width:650px}.focus-mode .top,.focus-mode .tabs,.focus-mode .chips,.focus-mode .panel,.focus-mode .target,.focus-mode .controls,.focus-mode .translation,.focus-mode .translit,.focus-mode .badge,.focus-mode .percent{display:none}.focus-mode .card{margin-top:18vh;border:0;background:transparent;box-shadow:none}.focus-mode .arbig{font-size:clamp(38px,10vw,60px)}.focus-mode .counter-wrap{width:min(500px,92vw)}
@media(max-width:480px){.app{padding:15px 12px 25px}.top{margin-bottom:12px}.tabs button{font-size:10.5px;padding:10px 4px}.card{padding:20px 10px 15px}.counter-wrap{width:88vw}.stats{gap:5px}.day{grid-template-columns:82px 1fr auto}.arbig.long{font-size:24px;line-height:1.75}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><small>цифровой тасбих</small><h1>Чётки <span>ذِكْر</span></h1></div><div class="actions"><button class="icon" id="theme" aria-label="Сменить тему">☼</button><button class="icon" id="focus" aria-label="Режим фокусировки">◉</button></div></header>
<nav class="tabs glass" aria-label="Разделы"><button class="active" data-cat="zikr">Зикр</button><button data-cat="salawat">Салават</button><button data-cat="asma">Имена</button><button data-cat="wird">Вирды</button><button data-cat="custom">Мои</button></nav>
<div class="chips" id="chips"></div>
<section class="card glass" id="card">
<div class="badge" id="badge">Зикр</div><div class="arbig" id="ar"></div><p class="translit" id="translit"></p><p class="translation" id="translation"></p>
<div class="target" id="targets"><span style="font-size:10px;color:var(--faint);font-weight:800;text-transform:uppercase">цель</span><button data-target="33">33</button><button data-target="99">99</button><button data-target="100">100</button><button data-target="custom">своя</button><span class="custom" id="custom"><input id="customInput" type="number" min="1" max="99999" placeholder="число"><button id="customApply">OK</button></span></div>
<div class="counter-wrap"><div class="orbit" id="orbit"></div><div class="ring" id="ring"></div><div class="percent" id="percent">0%</div><div class="center" id="tap" role="button" tabindex="0" aria-label="Увеличить счётчик"><div><div class="count" id="count">0</div><div class="round" id="round">1 круг</div><div class="tap">нажмите</div></div></div></div>
<div class="progress"><i id="progress"></i></div>
<div class="stats"><div class="stat"><b id="today">0</b><span>сегодня</span></div><div class="stat"><b id="streak">0</b><span>дней подряд</span></div><div class="stat"><b id="total">0</b><span>всего</span></div></div>
<div class="controls"><button class="control primary" id="voice">🎙 Голос</button><button class="control" id="sound">🔊 Звук</button><button class="control danger" id="reset">↺ Сброс</button></div><div class="focusbar" id="focusbar"><button class="control" id="exitFocus">Выйти из Focus</button></div>
</section>
<section class="panel glass"><div class="panel-head"><h2>История</h2><small id="historyMeta">последние дни</small></div><div class="history" id="history"></div></section>
</main>
<div class="modal" id="modal"><div class="dialog glass"><h2>Добавить зикр</h2><p>Создай свой текст. Он сохранится только на этом устройстве.</p><input id="newAr" placeholder="Арабский текст (необязательно)" dir="rtl"><input id="newName" placeholder="Название / транслитерация"><input id="newTrans" placeholder="Перевод (необязательно)"><div class="row"><button id="cancel">Отмена</button><button id="add">Добавить</button></div></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const DATA={
 zikr:[
  {id:'subhanallah',ar:'سُبْحَانَ ٱللَّٰهِ',name:'Субханаллах',tr:'Пречист Аллах',target:33},
  {id:'alhamdulillah',ar:'ٱلْحَمْدُ لِلَّٰهِ',name:'Альхамдулиллях',tr:'Хвала Аллаху',target:33},
  {id:'allahuakbar',ar:'ٱللَّٰهُ أَكْبَرُ',name:'Аллаху акбар',tr:'Аллах превыше всего',target:33},
  {id:'astaghfirullah',ar:'أَسْتَغْفِرُ ٱللَّٰهَ',name:'Астагфируллах',tr:'Прошу прощения у Аллаха',target:100}
 ],
 salawat:[{
  id:'salawat',
  ar:'اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ،\nكَمَا صَلَّيْتَ عَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ،\nاللَّهُمَّ بَارِكْ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ،\nكَمَا بَارَكْتَ عَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ',
  name:'Салават Ибрахимия',
  tr:'О Аллах, благослови Мухаммада и род Мухаммада, как Ты благословил род Ибрахима. Воистину, Ты — Достохвальный, Славный. О Аллах, даруй благодать Мухаммаду и роду Мухаммада, как Ты даровал благодать роду Ибрахима. Воистину, Ты — Достохвальный, Славный.',
  target:33,long:true
 }],
 asma:[
  {id:'allah',ar:'ٱللَّهُ',name:'Аллах',tr:'Аллах',target:99},
  {id:'arrahman',ar:'ٱلرَّحْمَٰنُ',name:'Ар-Рахман',tr:'Милостивый',target:99},
  {id:'arraheem',ar:'ٱلرَّحِيمُ',name:'Ар-Рахим',tr:'Милосердный',target:99}
 ],
 wird:[{id:'wird33',name:'После намаза',tr:'Субханаллах 33 · Альхамдулиллях 33 · Аллаху акбар 34',target:100,chain:['subhanallah','alhamdulillah','allahuakbar']}],
 custom:[]
};
const KEY='chetki2-state-v1';
let state=load();let recognition=null;let listening=false;let restartTimer=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}
function fresh(){return{cat:'zikr',active:'subhanallah',counts:{},daily:{},targets:{},custom:[],sound:true,theme:'royal',wirdStep:0}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function key(){return state.cat==='wird'?state.active+':'+state.wirdStep:state.active}
function list(){return state.cat==='custom'?state.custom:DATA[state.cat]||[]}
function item(){if(state.cat==='wird'){const w=DATA.wird.find(x=>x.id===state.active)||DATA.wird[0];return findItem(w.chain[state.wirdStep]||w.chain[0])}return findItem(state.active)}
function findItem(id){return [...DATA.zikr,...DATA.salawat,...DATA.asma,...state.custom].find(x=>x.id===id)}
function target(){return state.targets[key()]||item()?.target||33}
function count(){return state.counts[key()]||0}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function round(){return Math.floor(count()/33)+1}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1900)}
function $(s){return document.querySelector(s)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){
 document.documentElement.dataset.theme=state.theme;
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.cat===state.cat));
 const ls=list();
 $('#chips').innerHTML=ls.map(x=>`<button class="chip ${x.id===state.active?'active':''}" data-id="${esc(x.id)}">${x.ar?`<span class="ar">${esc(x.ar.split('\n')[0])}</span>`:''}<span class="name">${esc(x.name||x.title||x.id)}</span></button>`).join('')+(state.cat==='custom'?'<button class="chip" id="addChip"><span class="ar">＋</span><span class="name">Добавить</span></button>':'');
 document.querySelectorAll('.chip[data-id]').forEach(b=>b.onclick=()=>{state.active=b.dataset.id;state.wirdStep=0;save();render()});
 $('#addChip')?.addEventListener('click',()=>$('#modal').classList.add('show'));
 const x=item();if(!x)return;
 $('#badge').textContent=state.cat==='wird'?`Вирд · шаг ${state.wirdStep+1}/${DATA.wird.find(w=>w.id===state.active)?.chain.length||1}`:(state.cat==='zikr'?'Зикр':state.cat==='salawat'?'Салават':state.cat==='asma'?'Имена':'Мои');
 $('#ar').textContent=x.ar||'';$('#ar').classList.toggle('long',!!x.long);$('#translit').textContent=x.name||'';$('#translation').textContent=x.tr||'';
 $('#count').textContent=count();$('#round').textContent=`${round()} круг`;
 document.querySelectorAll('#targets button[data-target]').forEach(b=>b.classList.toggle('active',String(target())===b.dataset.target));
 const pct=Math.min(1,count()/Math.max(1,target()));$('#progress').style.width=pct*100+'%';$('#percent').textContent=Math.round(pct*100)+'%';$('#orbit').style.setProperty('--pct',(pct*360)+'deg');
 const c=count();const ring=$('#ring');ring.innerHTML='';const n=33;const filled=c%33;
 for(let i=0;i<n;i++){const b=document.createElement('i');b.className='bead'+(i<filled?' filled':'');const a=2*Math.PI*i/n-Math.PI/2,r=44;b.style.transform=`translate(calc(-50% + ${Math.cos(a)*r}%),calc(-50% + ${Math.sin(a)*r}%))`;ring.appendChild(b)}
 renderStats();renderHistory();
}
function renderStats(){const k=todayKey();const today=state.daily[k]||0;$('#today').textContent=today;$('#total').textContent=Object.values(state.daily).reduce((a,b)=>a+(Number(b)||0),0);let d=new Date(),s=0;for(let i=0;i<3650;i++){const q=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if((state.daily[q]||0)>0){s++;d.setDate(d.getDate()-1)}else{if(i===0){d.setDate(d.getDate()-1);continue}break}}$('#streak').textContent=s}
function renderHistory(){const days=[];let d=new Date(),max=1;for(let i=0;i<7;i++){const q=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),v=state.daily[q]||0;days.push([q,v]);max=Math.max(max,v);d.setDate(d.getDate()-1)}$('#history').innerHTML=days.map(([q,v])=>{const [y,m,day]=q.split('-');return`<div class="day"><span>${day}.${m}.${y.slice(2)}</span><div class="bar"><i style="width:${v?Math.max(4,v/max*100):0}%"></i></div><b>${v}</b></div>`}).join('')}
function inc(){const k=key(),v=(state.counts[k]||0)+1;state.counts[k]=v;const day=todayKey();state.daily[day]=(state.daily[day]||0)+1;save();const c=$('#tap');c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse');if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}if(state.sound)beep(v%33===0?'round':'tick');if(v>=target()){if(state.cat==='wird'){const w=DATA.wird.find(x=>x.id===state.active);if(w&&state.wirdStep<w.chain.length-1){state.wirdStep++;toast('Шаг завершён · продолжаем');state.counts[key()]=0}else{toast('Вирд завершён · الحمد لله');state.counts[k]=0}}else{toast('Цель выполнена · الحمد لله');state.counts[k]=0}save();render()}else render()}
function reset(){const k=key();state.counts[k]=0;save();render();toast('Счётчик сброшен')}
let ac;function beep(type){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type==='round'?'triangle':'sine';o.frequency.value=type==='round'?520:220;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(type==='round'?.18:.08,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.16)}catch(e){}}
function voice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast('Голос не поддерживается этим браузером');return}
 if(listening){stopVoice();return}
 startVoice(SR);
}
function startVoice(SR){
 clearTimeout(restartTimer);
 try{recognition=new SR()}catch(e){toast('Не удалось включить микрофон');return}
 recognition.continuous=true;recognition.interimResults=false;recognition.lang='ru-RU';recognition.maxAlternatives=3;
 recognition.onstart=()=>{listening=true;$('#voice').textContent='🔴 Слушаю';toast('Голос включён · говорите зикр')};
 recognition.onresult=e=>{
  for(let i=e.resultIndex;i<e.results.length;i++){
   if(!e.results[i].isFinal)continue;
   const texts=[];for(let a=0;a<e.results[i].length;a++)texts.push(e.results[i][a].transcript.toLowerCase());
   const t=texts.join(' ');let id=null;
   if(t.includes('субхан'))id='subhanallah';else if(t.includes('альхам')||t.includes('алхам'))id='alhamdulillah';else if(t.includes('акбар'))id='allahuakbar';else if(t.includes('астаг')||t.includes('астах'))id='astaghfirullah';else if(t.includes('салават')||t.includes('салят'))id='salawat';
   if(id){if(id==='salawat'){state.cat='salawat';state.active='salawat';state.wirdStep=0}else{state.cat='zikr';state.active=id;state.wirdStep=0}save();render();inc();toast('Услышано · +1')}
  }
 };
 recognition.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;$('#voice').textContent='🎙 Голос';toast('Нет доступа к микрофону');return}if(e.error!=='aborted')scheduleVoiceRestart(SR)};
 recognition.onend=()=>{if(listening)scheduleVoiceRestart(SR)};
 try{recognition.start()}catch(e){listening=false;$('#voice').textContent='🎙 Голос';toast('Не удалось включить микрофон')}
}
function scheduleVoiceRestart(SR){clearTimeout(restartTimer);if(!listening)return;restartTimer=setTimeout(()=>{if(!listening)return;try{recognition.start()}catch(e){try{startVoice(SR)}catch(err){}}},250)}
function stopVoice(){listening=false;clearTimeout(restartTimer);try{recognition?.stop()}catch(e){}recognition=null;$('#voice').textContent='🎙 Голос';toast('Голос выключен')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;state.wirdStep=0;if(state.cat==='wird')state.active=DATA.wird[0].id;else if(!findItem(state.active)||!list().some(x=>x.id===state.active))state.active=list()[0]?.id;save();render()});
$('#tap').onclick=inc;$('#tap').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inc()}};$('#reset').onclick=reset;$('#voice').onclick=voice;$('#sound').onclick=()=>{state.sound=!state.sound;save();$('#sound').textContent=state.sound?'🔊 Звук':'🔇 Тихо';toast(state.sound?'Звук включён':'Звук выключен')};
document.querySelectorAll('#targets button[data-target]').forEach(b=>b.onclick=()=>{if(b.dataset.target==='custom'){$('#custom').classList.add('show');$('#customInput').focus()}else{state.targets[key()]=Number(b.dataset.target);save();render()}});$('#customApply').onclick=()=>{const n=Math.max(1,Math.min(99999,Number($('#customInput').value)||33));state.targets[key()]=n;$('#custom').classList.remove('show');save();render()};
$('#theme').onclick=()=>{state.theme=state.theme==='royal'?'dark':state.theme==='dark'?'light':'royal';save();render()};$('#focus').onclick=()=>{document.body.classList.toggle('focus-mode');$('#focusbar').classList.toggle('show');};$('#exitFocus').onclick=()=>{$('#focus').click()};
$('#cancel').onclick=()=>$('#modal').classList.remove('show');$('#add').onclick=()=>{const name=$('#newName').value.trim();if(!name){toast('Укажи название');return}const x={id:'custom-'+Date.now(),ar:$('#newAr').value.trim(),name,tr:$('#newTrans').value.trim(),target:33};state.custom.push(x);state.cat='custom';state.active=x.id;$('#modal').classList.remove('show');['#newAr','#newName','#newTrans'].forEach(s=>$(s).value='');save();render()};$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};
window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.code==='Space'||e.key==='Enter'){e.preventDefault();inc()}if(e.key.toLowerCase()==='r')reset();if(e.key.toLowerCase()==='f'){$('#focus').click()}});
render();
</script>
